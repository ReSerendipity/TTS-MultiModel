name: Bug 报告
description: 提交一个 Bug 报告帮助我们改进 TTS MultiModel
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提交 Bug 报告！请尽可能详细地填写以下信息，这能帮助我们快速定位问题。
        TTS 项目的 Bug 大多和环境有关，请务必填写环境信息。

  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 简要描述你遇到的问题
      placeholder: "例如：批量合成时出现 OOM 错误，但显存应该足够"
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 详细描述如何复现这个问题
      placeholder: |
        1. 启动项目（参见 README 快速开始）
        2. 输入文本 '...'
        3. 选择引擎/模型 '...'
        4. 点击合成
        5. 出现错误
      render: markdown
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生什么？
      placeholder: "例如：音频应正常合成并保存到 outputs/ 目录"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？
      placeholder: "例如：报错 'CUDA out of memory'，任务状态变为 failed"
    validations:
      required: true

  - type: textarea
    id: error-log
    attributes:
      label: 错误日志 / 截图
      description: 粘贴错误日志或截图，可查看 logs/ 目录获取详细日志
      placeholder: |
        ```
        粘贴错误日志到这里
        ```
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 项目版本
      description: README 徽章或 config.yaml version 字段
      placeholder: "例如：2.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 10
        - Windows 11
        - Ubuntu 22.04
        - Ubuntu 24.04
        - Debian 12
        - macOS
        - 其他
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: GPU 型号与显存
      description: 你的显卡型号和显存大小
      placeholder: "例如：NVIDIA RTX 3060 12GB"
    validations:
      required: false

  - type: dropdown
    id: engine
    attributes:
      label: 使用的引擎
      description: 出现问题时使用的合成引擎
      options:
        - native
        - diffusers
        - 其他
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 还有其他需要说明的吗？
    validations:
      required: false