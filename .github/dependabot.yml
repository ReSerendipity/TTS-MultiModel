version: 2
updates:
  # minor/patch 合并为单个 PR，major 仍各自单独开 PR（便于逐个评审高风险版本跳跃）。
  # open-pull-requests-limit 限制并发 PR 数，避免 Dependabot 一次性铺开挤占 Actions 并发额度。
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/tests"
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]