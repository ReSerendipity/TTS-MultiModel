version: 2
updates:
  # minor/patch 合并为单个 PR，major 仍各自单独开 PR（便于逐个评审高风险版本跳跃）。
  # open-pull-requests-limit 限制并发 PR 数，避免 Dependabot 一次性铺开挤占 Actions 并发额度。
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    labels: [dependencies]
    ignore:
      # pydantic pins pydantic-core exactly (2.13.5 -> 2.46.5). Dependabot bumps
      # the two independently in this hand-maintained lock and produced an
      # uninstallable pair (see DraftPeek#92 / TTS_MultiModel#87). Regenerate the
      # lock instead: let pip resolve the pair together.
      - dependency-name: "pydantic-core"
      - dependency-name: "pydantic_core"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/tests"
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
