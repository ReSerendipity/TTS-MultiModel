version: 2
updates:
  # minor/patch 合并为单个 PR，major 仍各自单独开 PR（便于逐个评审高风险版本跳跃）。
  # open-pull-requests-limit 限制并发 PR 数，避免 Dependabot 一次性铺开挤占 Actions 并发额度。
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    labels: [dependencies]
    ignore:
      # pydantic pins pydantic-core exactly (2.13.5 -> 2.46.5). Dependabot bumps
      # the two independently in this hand-maintained lock and produced an
      # uninstallable pair (see DraftPeek#92 / TTS-MultiModel#87). Regenerate the
      # lock instead: let pip resolve the pair together.
      - dependency-name: "pydantic-core"
      - dependency-name: "pydantic_core"
      # torch 三件套是交付轨（便携包 / 镜像 / 开发环境）的共用锚点：显存行为只在
      # 2.13.0+cu132 上实测过（v2.2.4 的四次连续切换与 9489→3344 MiB 回落都是它）。
      # 2026-09-20 这个组把锁单独顶到 2.14.0/0.29.0，而 build_portable_bundle.ps1 仍钉
      # 2.13.0 —— 锁与交付轨静默分叉，且 2.14.0 那组合从未安装、从未运行过。
      # 升级走显式流程：先改脚本里的三处版本 + 三处哈希，再复算锁，两侧一起动；
      # 不变量由 tests/test_torch_track_consistency.py 机器核对。
      - dependency-name: "torch"
      - dependency-name: "torchvision"
      # omegaconf/hydra-core/antlr4 三角互斥：hydra-core 1.3.8 requires_dist
      # "omegaconf<2.4" 且 "antlr4-python3-runtime==4.9.*"，omegaconf 2.3.x 又钉
      # antlr4==4.9.*。2026-11-17 的组 PR（#253）把 antlr4 顶到 4.13.2 令锁不可解
      # （pip-audit / check_pin_crossconflicts 双红）。三处成对 ignore，等
      # hydra-core 放开 omegaconf>=2.4 上界后一并解除。
      - dependency-name: "omegaconf"
      - dependency-name: "hydra-core"
      - dependency-name: "antlr4-python3-runtime"
      # sympy 1.14.0（当前最新）requires_dist "mpmath<1.4,>=1.1.0"，PyPI 无任何
      # sympy 版本可搭配 mpmath>=1.4。#253 把锁顶到 1.4.1 令 ResolutionImpossible。
      # 与家族仓 VOSR2-Lite 同一条 ignore（2026-11-19 落地）；解除条件见其注释。
      - dependency-name: "mpmath"
      # pydantic 端补齐：pydantic-core/pydantic_core 已 ignore，但组 PR 仍会单独
      # 顶 pydantic（requirements-small 直钉），造成 core 不跟的错位对（#253 实测
      # pydantic==2.14.3 要求 core==2.50.4 而锁停在 2.50.1）。两端一起 freeze，
      # 升级走显式重锁。
      - dependency-name: "pydantic"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/tests"
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
  # desktop/ Tauri 壳的 npm 依赖（@tauri-apps/cli 等）——与 SeedVR2 的 /desktop 覆盖对齐（2026-11-18 审查 F-T4）
  - package-ecosystem: npm
    directory: "/desktop"
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
