# 一次性探针：证明 Dockerfile 里那段「deadsnakes 索引就绪守卫」真的会在 PPA 取不到时硬停。
#
# 为什么需要它：本仓要修的这个故障是**间歇性**的（PPA 侧抖一下），修完之后没法等下一次抖动
# 来验收。所以这里用"把 deadsnakes 源指向 127.0.0.1:9（连接立刻被拒）+ 删掉已缓存的索引"
# 造出与 CI 现场等价的状态，然后跑**从 Dockerfile 里抽出来的原文**（不是手抄副本，避免漂移）：
#   1. 旧序列（直接 apt-get update && apt-get install python3.12）必须复现出
#      "update 返回 0 + W: Some index files failed to download → install 报 Unable to locate package"，
#      即 2026-09-21 12:19/12:28 两次构建红的症状本身；
#   2. 新守卫必须非零退出并打出可操作原因；
#   3. 健康态下 Dockerfile 的第一条 RUN 原文必须能跑通（证明修法没把正常路径弄坏）。
# 结论拿到后本文件删除。
name: Docker apt guard probe (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/_docker-apt-probe.yml"
      - "Dockerfile"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Verify the PPA index guard
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: nvidia/cuda:12.1.0-runtime-ubuntu22.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: 从 Dockerfile 抽出守卫段与 stage1 原文
        run: |
          set -eu
          # 每条 RUN 的完整文本（到不以反斜杠结尾的行为止）；顺手吃掉 CR，判据与行尾无关。
          # n 只自增、on 负责开关，别用 n 兼作开关——否则每段都编号 1，全叠进同一个文件。
          awk '
            { sub(/\r$/, "") }
            /^RUN /{n++; on=1; sub(/^RUN /, "")}
            on { print > (sprintf("/tmp/run%02d.sh", n)) }
            !/\\$/{on=0}
          ' Dockerfile
          # 守卫段：从 "for i in 1 2 3 4 5; do" 到与之配对的 "done"。
          # 全部在 awk 里做替换（不经过 sed），去掉行尾续行符与开头的 "&&"。
          awk '
            { sub(/\r$/, "") }
            /for i in 1 2 3 4 5; do/{on=1}
            on { sub(/\\$/, ""); sub(/^ *&& */, ""); print }
            on && /^ *done/{exit}
          ' Dockerfile > /tmp/guard.sh
          echo "=== /tmp/guard.sh ==="; cat /tmp/guard.sh
          echo "=== 抽出来的 RUN 段 ==="; ls -l /tmp/run*.sh
          test -s /tmp/guard.sh
          sh -n /tmp/guard.sh           # 抽出来的必须是合法 shell
          # 反空验证：抽到的确实是 Dockerfile 里那段守卫，且变量没被加工环节吃掉
          grep -q '查不到 python3.12' /tmp/guard.sh
          grep -q '\$i' /tmp/guard.sh
          grep -q 'Acquire::Retries' /tmp/guard.sh
          # 反空验证：stage1 只含第一条 RUN（编号/开关写错时会把整个 Dockerfile 叠进来），
          # 且已去掉 RUN 前缀、结尾停在 ensurepip 那一行
          ! grep -q '^RUN' /tmp/run01.sh
          grep -q 'python3.12 -m ensurepip --upgrade' /tmp/run01.sh
          ! grep -q 'git lfs install' /tmp/run01.sh
          head -1 /tmp/run01.sh | grep -q '^apt-get update'
          test "$(wc -l < /tmp/run01.sh)" -le 25

      - name: 反空验证——未加 PPA 时 python3.12 在索引里查不到
        run: |
          set +e
          apt-cache show python3.12 >/dev/null 2>&1
          rc=$?
          set -e
          echo "apt-cache show python3.12 退出码 = $rc（期望非 0：说明这条判据真能判 false）"
          test "$rc" -ne 0

      - name: 装上 PPA（与 Dockerfile 到守卫之前的状态一致）
        run: |
          apt-get update
          apt-get install -y --no-install-recommends software-properties-common ca-certificates
          add-apt-repository -y ppa:deadsnakes/ppa

      - name: 健康态——守卫段（Dockerfile 原文）必须放行
        run: |
          set +e
          sh /tmp/guard.sh
          rc=$?
          set -e
          echo "健康态退出码 = $rc（期望 0）"
          test "$rc" -eq 0

      - name: 破坏 deadsnakes 源并把索引恢复成"没抓下来"的状态
        run: |
          set -eu
          ls /etc/apt/sources.list.d/
          # PPA 条目在 22.04 上是 deb822 (.sources)；老式 .list 也一并处理
          find /etc/apt/sources.list.d -name 'deadsnakes*' -print -exec \
            sed -i -E 's#https?://ppa\.launchpadcontent\.net/deadsnakes#http://127.0.0.1:9/nope#' {} \;
          grep -rn "127.0.0.1:9" /etc/apt/sources.list.d/ || { echo "SABOTAGE FAILED"; exit 1; }
          rm -f /var/lib/apt/lists/*deadsnakes*
          echo "已删除缓存索引："; ls /var/lib/apt/lists/ | grep -c deadsnakes || true

      - name: 复现旧症状——apt-get update 返回 0，两步之后才炸成 Unable to locate package
        run: |
          set +e
          out_update=$(apt-get update 2>&1); rc_update=$?
          echo "$out_update" | grep -E "Ign:|W: Some index files|Err:" | head -8
          echo ">>> apt-get update 退出码 = $rc_update（旧序列在这里**没有**停下，这就是静默降级）"
          out_install=$(apt-get install -y --no-install-recommends python3.12 2>&1); rc_install=$?
          echo "$out_install" | grep -E "Unable to locate|Couldn't find any package" | head -4
          echo ">>> apt-get install python3.12 退出码 = $rc_install"
          set -e
          # 断言：症状与 2026-09-21 run 35598902698 完全一致
          test "$rc_update" -eq 0
          echo "$out_update" | grep -q "Some index files failed to download"
          test "$rc_install" -ne 0
          echo "$out_install" | grep -q "Unable to locate package python3.12"

      - name: 破坏态——守卫段（Dockerfile 原文）必须非零退出并说清原因
        run: |
          set +e
          out=$(sh /tmp/guard.sh 2>&1); rc=$?
          set -e
          echo "$out" | tail -20
          echo ">>> 破坏态退出码 = $rc（期望非 0）"
          test "$rc" -ne 0
          echo "$out" | grep -q "PPA 侧或网络故障"
          echo "守卫按预期硬停：不会带着半套索引继续往下装"

      - name: 健康态全链路——Dockerfile 第一条 RUN 原文跑通
        run: |
          set -eu
          # 还原被破坏的源，让 stage1 自己走一遍真实路径
          find /etc/apt/sources.list.d -name 'deadsnakes*' -exec \
            sed -i -E 's#http://127\.0\.0\.1:9/nope#https://ppa.launchpadcontent.net/deadsnakes#' {} \;
          sh /tmp/run01.sh
          python3.12 -V
          python3.12 -m ensurepip --version >/dev/null && echo "stage1 原文在真实 PPA 下跑通"
