name: Performance Benchmark

on:
  push:
    branches: [main]
    paths:
      - 'app/integrated_app/**'
      - 'tests/benchmarks/**'
      - '.github/workflows/benchmark.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/integrated_app/**'
      - 'tests/benchmarks/**'
      # 门禁脚本自己也算一条：改了判据却不在 PR 上跑一次，就等于把没验证过的逻辑合进 main
      # （push 侧本来有这个 paths，PR 侧漏了 —— 2026-09-22 补）。
      - '.github/workflows/benchmark.yml'
  schedule:
    # Run weekly on Sunday at 00:07 UTC
    - cron: '7 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-benchmark

      # 2026-08-31 治理修复（P2-1）：跨 run 基线持久化。
      # 此前 `last_run` 的 cp 复制只存在于单次 runner 内、无缓存持久化，
      # 导致对比步 `if [ -d output/benchmarks/last_run ]` 几乎永远为假，
      # 趋势对比（--benchmark-compare-fail=mean:20%）从未真正生效。
      # 现在用 actions/cache 持久化 pytest-benchmark 的 storage 目录：
      #   - main push：restore 历史 → 保存新 run → post 自动 save（key 含 sha，
      #     精确 key 不命中，restore 命中 restore-key，post 会执行 save 更新基线）。
      #   - PR：restore 命中 main 分支的基线缓存 → 对比步取到真实历史。
      #   - 非 fork 内 PR 共享仓库级缓存；fork PR 无法读缓存时走无基线降级路径。
      - name: Restore benchmark storage cache
        id: bench-cache
        uses: actions/cache@v6
        with:
          path: output/benchmarks
          key: benchmark-storage-${{ github.ref }}-${{ github.sha }}
          # 只允许命中 **main** 产出的基线。原先末尾那条裸前缀 `benchmark-storage-`
          # 会让任何分支的缓存都被命中 —— 于是"历史基线"经常是同一个 PR 两分钟前的那次 run
          # （issue #118 的机制之一：自己和自己比，然后因为 runner 抖动判你回退）。
          restore-keys: |
            benchmark-storage-refs/heads/main

      - name: Run performance benchmarks
        env:
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_OFFLINE: "1"
          MODELSCOPE_OFFLINE: "1"
          CUDA_VISIBLE_DEVICES: ""
        run: |
          pytest tests/benchmarks/ -v --tb=short -m "benchmark" \
            --benchmark-only \
            --benchmark-columns=rounds,iterations,mean,median,stddev,min,max \
            --benchmark-sort=mean \
            --benchmark-storage=output/benchmarks \
            --benchmark-save=ci-${{ github.sha }}

      # 趋势对比（regression gate）：仅 PR 且拿得到 main 基线时阻断。
      # 判据换掉了，原因都在 issue #118 里有实测数据：
      #   ① 同一份代码在共享 runner 之间 median/mean 能差 17%–80%，旧阈值 `mean:20%` 没有判别力
      #      → 随机红。随机红的门禁会让人学会忽略红灯，比没有门禁更坏。
      #   ② pytest-benchmark 的 `--benchmark-compare-fail` 是双向判定，**变快也算失败** —— 方向就错了。
      #   ③ 旧的 restore-keys 有裸前缀兜底，会命中任意分支的缓存，"基线"经常是同一 PR 上一轮
      #      （已在上一步修掉）。
      #   ④ 整段输出被 `>> $GITHUB_STEP_SUMMARY 2>&1 || exit 1` 吞掉，日志里只剩一行
      #      `Process completed with exit code 1`，红得没有可读证据。
      #   ⑤ 旧步骤还会**再跑一遍 pytest** 来对比，等于把同一批基准测两次、把抖动放大两次。
      # 现在：直接读上一步存下的 JSON 与 main 基线比，只判"变慢超过阈值"，并逐条打印数字。
      - name: Compare benchmark results (regression gate)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          SHA: ${{ github.sha }}
          GATE_PCT: "50"  # 变慢 >50% 才红。不是"宽松"，是承认噪声地板：见 ①，更紧的阈值只会随机红
        run: |
          python - <<'PY'
          import glob, json, os, sys

          sha = os.environ["SHA"]
          gate = float(os.environ["GATE_PCT"])
          repo_baseline = os.environ.get("REPO_BASELINE", "benchmarks/baseline.json")
          all_runs = glob.glob("output/benchmarks/*/*.json")
          mine = [p for p in all_runs if f"ci-{sha}" in os.path.basename(p)]
          base = [p for p in all_runs if f"ci-{sha}" not in os.path.basename(p)]

          def medians(path):
              with open(path, encoding="utf-8") as fh:
                  data = json.load(fh)
              # 两种形状都得认，认漏一种就是"0 条对比 → 直接通过"的假绿：
              #   pytest-benchmark 的 storage JSON：benchmarks 在**顶层**
              #   scripts/export_benchmark_baseline.py 的 L3 基线：包在 {"benchmark": {...}} 里
              items = data.get("benchmarks") or (data.get("benchmark") or {}).get("benchmarks") or []
              return {b["name"]: b["stats"]["median"] for b in items}

          if not mine:
              print("::error::本轮结果没有存下来，无法对比 —— 这是流程问题，不是性能回退")
              sys.exit(1)

          # 基线来源按 benchmarks/README.md 的三级存储退让：
          #   L1 = actions 缓存里的历史 run。指望不上：仓库缓存配额 10 GB 已用 10.23 GB，
          #        实测 main 在 07:42 存的基线，到 09:42（两小时后、同一天）就被驱逐了，
          #        PR 侧 restore 直接 "Cache not found"。所以必须有 L3。
          #   L3 = 仓内基线 benchmarks/baseline.json（随 checkout 就在，不受配额影响，可 code review）
          # 两边都没有 → 仅记录；但 L3 文件在而里面 0 条，要单独喊出来（那是占位文件，不是"没问题"）。
          if base:
              ref_path, source = max(base, key=os.path.getmtime), "L1 actions 缓存"
          elif os.path.exists(repo_baseline) and medians(repo_baseline):
              ref_path, source = repo_baseline, "L3 仓内基线（缓存被驱逐时的兜底）"
          else:
              if os.path.exists(repo_baseline):
                  print(f"::warning::{repo_baseline} 存在但一条 benchmark 都没有 —— "
                        "那是占位文件；跑 scripts/export_benchmark_baseline.py 填它，否则这一级等于不存在。")
              print("拿不到任何基线（L1 缓存没有、L3 仓内基线缺失或为空）→ 仅记录，不判回归。")
              print("想让门禁生效：把 main 上的一次 benchmark 结果导出成 " + repo_baseline + "。")
              sys.exit(0)

          cur, ref = medians(mine[0]), medians(ref_path)
          print(f"基线来源：{source}")
          print(f"基线：{ref_path}")
          print(f"本轮：{os.path.basename(mine[0])}")
          print(f"{'benchmark':<50} {'基线 median':>13} {'本轮 median':>13} {'变化':>8}  判定")
          bad = []
          for name in sorted(set(cur) | set(ref)):
              a, b = ref.get(name), cur.get(name)
              if not a or a <= 0 or b is None:
                  print(f"{name[:50]:<50} {'—':>13} {'—':>13} {'—':>8}  跳过（单侧缺数据）")
                  continue
              delta = (b - a) / a * 100.0
              hit = delta > gate
              if hit:
                  bad.append(f"{name}: median {a:.6f} → {b:.6f}（+{delta:.1f}%）")
              print(f"{name[:50]:<50} {a:13.6f} {b:13.6f} {delta:+7.1f}%  {'红' if hit else 'ok'}")
          if bad:
              print(f"\n::error::性能回退：{len(bad)} 项 median 变慢超过 {gate:.0f}%（阈值由来见本步骤上方注释与 issue #118）")
              for line in bad:
                  print("  " + line)
              sys.exit(1)
          print(f"\n没有项变慢超过 {gate:.0f}%。变快不判失败（issue #118 的 ②）。")
          PY

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: output/benchmarks/
          retention-days: 30

      # 原先这里有两步 "Export baseline for release" / "Upload baseline to release assets"
      # （README 里的 L2），条件是 `startsWith(github.ref, 'refs/tags/')`。本工作流的触发器是
      # push:branches[main] / pull_request / schedule / workflow_dispatch，正常跑时 ref 永远不是
      # tag —— 只有手工 dispatch 并选一个 tag 才可能进去。实测 v2.2.1/v2.2.2/v2.2.3 三个 Release
      # 的资产里都没有 benchmark-baseline-*.json，即这条路从没真跑通过，门禁也不读它。
      # 现在基线由上面的 L3（benchmarks/baseline.json，随 checkout 就在）承担；
      # 需要刷新它时在本地跑：
      #   python scripts/export_benchmark_baseline.py <storage目录> benchmarks/baseline.json --name main-<sha>
      # 要恢复 L2 的话，得先给它一个真能触发的入口（独立 workflow_call 或 tag 触发器 + 不带 paths 过滤），
      # 别放一个永远不会执行的步骤在这里假装"永久存储已有"。

      - name: Upload GPU benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-benchmark-results-${{ github.sha }}
          path: output/gpu-benchmarks/
          retention-days: 60
