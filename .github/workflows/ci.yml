name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check bin/integrated_app/ scripts/

      - name: Run ruff format check
        run: ruff format bin/integrated_app/ scripts/ --check --diff

  compat:
    name: 3-Engine Compatibility Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run 3-engine compatibility check
        env:
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_OFFLINE: "1"
          MODELSCOPE_OFFLINE: "1"
          CUDA_VISIBLE_DEVICES: ""
        run: python scripts/check_3engine_compat.py

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          pip install --upgrade pip
          pip install torch torchvision torchaudio
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx
        shell: pwsh

      - name: Dependency consistency check
        run: python scripts/sync_requirements.py --check

      - name: Run 3-engine compatibility check
        env:
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_OFFLINE: "1"
          MODELSCOPE_OFFLINE: "1"
          CUDA_VISIBLE_DEVICES: ""
        run: python scripts/check_3engine_compat.py || true

      - name: Run tests with coverage
        env:
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_OFFLINE: "1"
          MODELSCOPE_OFFLINE: "1"
          CUDA_VISIBLE_DEVICES: ""
        run: |
          pytest tests/ -v --tb=short --cov=bin/integrated_app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=40 \
            -k "not gpu and not cuda and not vram" -m "not integration"

      - name: Run benchmark tests
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && runner.os == 'Linux'
        env:
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_OFFLINE: "1"
          MODELSCOPE_OFFLINE: "1"
          CUDA_VISIBLE_DEVICES: ""
        run: |
          pytest tests/benchmarks/ -v --tb=short -m "benchmark" || true

      - name: Run integration tests
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && runner.os == 'Linux'
        env:
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_OFFLINE: "1"
          MODELSCOPE_OFFLINE: "1"
          CUDA_VISIBLE_DEVICES: ""
        run: |
          pytest tests/ -v --tb=short -m "integration" || true

      - name: Upload coverage report
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}-${{ runner.os }}
          path: coverage.xml

  build:
    name: Build (sdist/wheel)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check package metadata
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
