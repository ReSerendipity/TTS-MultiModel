name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # 2026-08-30 由 continue-on-error: true 收紧为**阻断**。
    # WHY 现在可以阻断：ruff 的结论不依赖项目运行时包（torch / soundfile 等），
    # 且版本与 .pre-commit-config.yaml 的 v0.16.5 钉死一致、precheck.ps1 用同一套
    # pyproject 配置 —— 三条链路的判据同源，这里的红必定能在本地复现，
    # 不存在「只有 CI 红」的假阳性来源。原先的 continue-on-error 让 lint job
    # 长期等于没有（它一直是绿的，因为 mypy 那一步的失败被整 job 吞掉了）。
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.16.5

      - name: Run ruff check
        run: |
          ruff check app/integrated_app/ scripts/ tests/

      - name: Run ruff format check
        run: |
          ruff format app/integrated_app/ scripts/ tests/ --check --diff

  typecheck:
    # 独立成 job（原先挂在 lint 的最后一步）：mypy 与 ruff 的处置节奏完全不同，
    # 混在一个 job 里会让「ruff 已可阻断」这件事被 mypy 的存量债务拖住。
    name: Typecheck (mypy ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # 阻断的是「债务上升」，不是「债务为零」。存量类型错误不要求一次性清零，
    # 但任何人新增一处类型回归都会让本 job 变红 —— 这是唯一能让 268 项存量
    # 不再继续增长的可执行办法。
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mypy
        run: pip install mypy==2.3.1

      # 基线 .ci/mypy_baseline.txt 与「本 job 只装 mypy、不装项目依赖」强耦合：
      # 缺 torch/soundfile 时这些第三方符号在 mypy 眼里是 Any，attr-defined /
      # assignment 一类错误不会浮现。实测同一份代码 —— 本 job 口径 141 项，
      # 而本机全依赖 venv 口径 268 项。因此**任何改动本 job 依赖集或 mypy 版本
      # 的 PR，都必须用相同命令重新生成基线**，否则门禁会以假阳性变红：
      #   pip install mypy==<同版本>
      #   mypy app/integrated_app/ --ignore-missing-imports --no-error-summary | grep -c 'error:'
      - name: Run mypy and enforce ratchet
        run: |
          mypy app/integrated_app/ --ignore-missing-imports --no-error-summary > mypy.log 2>&1 || true
          # 注意：grep -c 在零匹配时**依然打印 0**、只是退出码为 1，
          # 所以这里只能 `|| true`，绝不能写 `|| echo 0`（那样变量会变成 "0\n0"，
          # 一旦类型债务真的清零，本步骤反而会在数值比较处崩掉）。
          COUNT=$(grep -c 'error:' mypy.log || true)
          BASELINE=$(tr -d '[:space:]' < .ci/mypy_baseline.txt)
          COUNT=${COUNT:-0}
          if ! [ "$COUNT" -eq "$COUNT" ] 2>/dev/null || ! [ "$BASELINE" -eq "$BASELINE" ] 2>/dev/null; then
            echo "::error::计数解析失败 (COUNT='$COUNT' BASELINE='$BASELINE')，门禁本身出错，拒绝放行"
            exit 1
          fi
          echo "mypy 错误数: $COUNT（基线 $BASELINE）"
          echo "### mypy: $COUNT errors (baseline $BASELINE)" >> "$GITHUB_STEP_SUMMARY"
          head -n 60 mypy.log
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::类型债务上升：$BASELINE -> $COUNT。本门禁只降不升；如确需新增，请连同基线一起说明原因。"
            exit 1
          fi
          if [ "$COUNT" -lt "$BASELINE" ]; then
            echo "::warning::类型债务已降至 $COUNT，请把 .ci/mypy_baseline.txt 从 $BASELINE 下调以固化成果。"
          fi

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip check
          pip install pytest pytest-asyncio pytest-cov pytest-timeout httpx pytest-github-actions-annotate-failures

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          pip install --upgrade pip
          pip install torch torchvision torchaudio
          pip install -r requirements.txt
          pip check
          pip install pytest pytest-asyncio pytest-cov pytest-timeout httpx pytest-github-actions-annotate-failures

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip check
          pip install pytest pytest-asyncio pytest-cov pytest-timeout httpx pytest-github-actions-annotate-failures
        shell: pwsh

      - name: Run tests with coverage
        env:
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_OFFLINE: "1"
          MODELSCOPE_OFFLINE: "1"
          CUDA_VISIBLE_DEVICES: ""
        run: |
          # 2026-08-31 治理修复（P1-1）：移除 `|| true`，恢复测试与覆盖率门禁的真实阻断。
          # 此前 `--cov-fail-under=40` 的覆盖率门禁被 `|| true` 完全吞掉，覆盖率掉到 0% CI 仍绿，
          # 导致「CI 全绿」无法作为 MLOps 成效的可信指标。恢复后：
          #   - pytest 任一用例失败 → 本 job 变红
          #   - 覆盖率低于 40% → 本 job 变红（门禁真正生效）
          pytest tests/ -v --tb=short --timeout=180 --ignore=tests/e2e --cov=app/integrated_app --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov --cov-fail-under=40 \
            -m "not integration and not gpu and not cuda and not vram"

      - name: Run benchmark tests
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && runner.os == 'Linux'
        env:
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_OFFLINE: "1"
          MODELSCOPE_OFFLINE: "1"
          CUDA_VISIBLE_DEVICES: ""
        run: |
          # 2026-08-31 治理修复（P1-1）：移除 `|| true`，性能基准失败应真实可见
          pytest tests/benchmarks/ -v --tb=short -m "benchmark"

      - name: Run integration tests
        if: runner.os == 'Linux'
        env:
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_OFFLINE: "1"
          MODELSCOPE_OFFLINE: "1"
          CUDA_VISIBLE_DEVICES: ""
        run: |
          # 2026-08-31 治理修复（P1-1）：移除 `|| true`，集成测试失败应真实可见
          pytest tests/integration/ -v --tb=short --no-header -q \
            -m "not gpu and not cuda and not vram"

      - name: Upload coverage report
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}-${{ runner.os }}
          path: coverage.xml

      - name: Upload coverage to Codecov
        if: always() && runner.os == 'Linux' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: tts-multimodel-coverage
          fail_ci_if_error: false

  build:
    name: Build (sdist/wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: test
    # 2026-08-31 治理修复（P1-1）：移除 continue-on-error，构建失败应真实阻断
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        # 2026-08-31 治理修复（P1-1）：移除 `|| true`，构建失败应真实阻断
        run: python -m build

      - name: Check package metadata
        # 2026-08-31 治理修复（P1-1）：移除 `|| true`，元数据校验失败应真实阻断
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ── 安全断言（部署安全红线，2026-08-17 新增） ──────────────────
  security-assertions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 2026-08-31 治理修复（P1-1）：移除 continue-on-error，安全红线断言失败应真实阻断
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: 禁止 0.0.0.0 监听
        run: |
          HITS=$(grep -rn --include='*.py' --include='*.bat' --include='*.sh' --include='*.yml' \
            -E "host[[:space:]]*=[[:space:]]*['\"]0\.0\.0\.0|--host[[:space:]]+0\.0\.0\.0" \
            app config.yaml start.bat start.sh 2>/dev/null | grep -v tests || true)
          if [ -n "$HITS" ]; then echo "FAIL: 发现 0.0.0.0 监听配置"; echo "$HITS"; exit 1; fi
          echo "PASS: 无 0.0.0.0 监听配置"
      - name: 入口文件一致性
        run: |
          test -f app/clean_launch.py || test -f backend/main.py || exit 1
          test -f requirements.txt
          echo "PASS: 入口与依赖清单存在"
      - name: 依赖锁存在性
        run: |
          test -f requirements-lock.txt || (echo "FAIL: 缺少 requirements-lock.txt" && exit 1)
          echo "PASS: 依赖锁存在"
