name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff and mypy
        run: pip install ruff mypy

      - name: Run ruff check
        run: ruff check bin/integrated_app/ scripts/

      - name: Run ruff format check
        run: ruff format bin/integrated_app/ scripts/ --check --diff

      - name: Run mypy type check
        run: mypy bin/integrated_app/ --ignore-missing-imports || true

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip check
          pip install pytest pytest-asyncio pytest-cov pytest-timeout httpx pytest-github-actions-annotate-failures

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          pip install --upgrade pip
          pip install torch torchvision torchaudio
          pip install -r requirements.txt
          pip check
          pip install pytest pytest-asyncio pytest-cov pytest-timeout httpx pytest-github-actions-annotate-failures

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip check
          pip install pytest pytest-asyncio pytest-cov pytest-timeout httpx pytest-github-actions-annotate-failures
        shell: pwsh

      - name: Run tests with coverage
        env:
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_OFFLINE: "1"
          MODELSCOPE_OFFLINE: "1"
          CUDA_VISIBLE_DEVICES: ""
        run: |
          pytest tests/ -v --tb=short --timeout=180 --ignore=tests/e2e --cov=bin/integrated_app --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov --cov-fail-under=40 \
            -m "not integration and not gpu and not cuda and not vram"

      - name: Run benchmark tests
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && runner.os == 'Linux'
        env:
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_OFFLINE: "1"
          MODELSCOPE_OFFLINE: "1"
          CUDA_VISIBLE_DEVICES: ""
        run: |
          pytest tests/benchmarks/ -v --tb=short -m "benchmark"

      - name: Run integration tests
        if: runner.os == 'Linux'
        env:
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_OFFLINE: "1"
          MODELSCOPE_OFFLINE: "1"
          CUDA_VISIBLE_DEVICES: ""
        run: |
          pytest tests/integration/ -v --tb=short -m "integration or not integration" --no-header -q

      - name: Upload coverage report
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}-${{ runner.os }}
          path: coverage.xml

      - name: Upload coverage to Codecov
        if: always() && runner.os == 'Linux' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: tts-multimodel-coverage
          fail_ci_if_error: false

  build:
    name: Build (sdist/wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check package metadata
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
