name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # 2026-08-30 由 continue-on-error: true 收紧为**阻断**。
    # WHY 现在可以阻断：ruff 的结论不依赖项目运行时包（torch / soundfile 等），
    # 且版本与 .pre-commit-config.yaml 的 v0.16.5 钉死一致、precheck.ps1 用同一套
    # pyproject 配置 —— 三条链路的判据同源，这里的红必定能在本地复现，
    # 不存在「只有 CI 红」的假阳性来源。原先的 continue-on-error 让 lint job
    # 长期等于没有（它一直是绿的，因为 mypy 那一步的失败被整 job 吞掉了）。
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.16.5

      - name: Run ruff check
        run: |
          ruff check app/integrated_app/ scripts/ tests/

      - name: Run ruff format check
        run: |
          ruff format app/integrated_app/ scripts/ tests/ --check --diff

      - name: Config-vs-code consistency gate (security)
        # 对应安全评估根因门禁：config.yaml 中声明的 security/runtime 配置项
        # 必须被代码真实消费，否则 CI 直接失败（杜绝「配置幻觉」式假控制）。
        run: |
          pip install pyyaml
          python scripts/check_config_refs.py

      - name: Engine specs three-way consistency gate (P1-2)
        # 后端设计评估 P1-2：config.yaml engines ↔ engine_registry ↔ 磁盘权重路径
        # 三向一致；sample_rate / supported_features / 引擎集合 / model_dir 任一
        # 不一致即 FAIL（languages 差异为 WARN 不阻断，产品级声明 vs text_frontend）。
        run: |
          pip install pyyaml
          python scripts/check_engine_specs.py

      - name: Declared capabilities gate (综合评估主线)
        # 能力声明→验证：版本三向一致（FAIL）/ 训练产物 / SLO 基线 / 覆盖缓冲
        # （后三者 WARN 不阻断，见 scripts/check_declared_capabilities.py 口径说明）。
        run: |
          pip install pyyaml
          python scripts/check_declared_capabilities.py

      - name: Pin cross-constraint gate (锁集自洽)
        # 锁文件内部必须互相满足：A==x 声明 requires B<2，而锁里 B==2.3 就是破图 ——
        # 用户 `pip install -r requirements-lock.txt` 装出来的是坏环境，`pip check` 才报。
        # 这类问题以前只有 pre-commit 的 `files:` 触发（改动 lock 才跑），所以已经坏在
        # main 上的锁集没人看得见（2026-09-21 实测：transformers==4.52.1 要 tokenizers<0.22
        # 而锁里是 0.23.2，另有 antlr4/mpmath 两处）。这里每次 PR 都跑，漂移当场红。
        run: |
          pip install packaging
          python scripts/check_pin_crossconflicts.py

      - name: Integrity manifest sync gate (security)
        # 防止「核心模块代码已改、完整性清单未重新生成」：改动 app/integrated_app/ 下
        # 任一 _CORE_MODULES 文件后若未同步 security/integrity_manifest.json，运行时
        # enforce 自检会在哈希比对阶段失败并拒绝启动（RuntimeError，例「校验通过 13/16」）。
        # 本门禁在提交/推送/CI 阶段提前拦截，判据与本地 pre-commit 钩子同源。命中后修复：
        # 先 git log 确认改动合法（非篡改），再 generate_integrity_manifest.py 重生成、
        # sign_integrity_manifest.py 重签（有 data/.manifest_signing_key 走 Ed25519）。
        run: |
          python scripts/check_integrity_manifest_sync.py

  # 类型门禁（mypy ratchet，家族底线；2026-09-03 接入组织级 reusable workflow）
  # 门禁逻辑统一维护在 ReSerendipity/.github 的 python-quality-baseline.yml，
  # 本仓只传参数。模板口径与历史内联实现完全一致（mypy==2.3.1、
  # --ignore-missing-imports --no-error-summary、只装 mypy 不装项目依赖、
  # 基线 .ci/mypy_baseline.txt），迁移零漂移。
  # 独立成 job 的理由不变：mypy 与 ruff 处置节奏不同，
  # 不让「ruff 已可阻断」被 mypy 的存量债务拖住。
  # ⚠️ 改 mypy 版本或依赖集 = 换测量口径，必须用基线注释命令重算基线。
  #（原内联实现见 git 历史；迁移记录 docs/reports/mypy-ratchet-组织级门禁迁移_20260903.md）
  typecheck:
    name: Typecheck (mypy ratchet)
    # 钉定到 commit SHA（供应链加固：防上游 @main 漂移引入不可控的门禁变更）。
    # 升级口径（何时/由谁解钉）：仅在本仓需要 org 模板的新功能或安全修复时才解钉，
    # 由本仓维护者手动核对 ReSerendipity/.github@main 目标 commit 后替换下方 SHA，
    # 并本地跑 `python scripts/check_spec_refs.py` + YAML 解析（如 `python -c "import yaml;yaml.safe_load(open('.github/workflows/ci.yml'))"`，有 actionlint 时一并跑）校验；
    # 不自动跟随 main。SHA 解析于 2026-09-18（当时 main HEAD=2c0c5ab，提交日期 2026-09-14）。
    uses: ReSerendipity/.github/.github/workflows/python-quality-baseline.yml@2c0c5abbe2acdb8efb793482b5c79411ed34bde6
    with:
      package: app/integrated_app
      include_tests: false
      mypy_target: app/integrated_app/
      mypy_baseline_file: .ci/mypy_baseline.txt
      pip_cache_dependency_path: requirements.txt
    permissions:
      contents: read

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          # 训练层测试依赖（= pyproject.toml [training] extra）：缺失时
          # tests/training/* 因 skipif 整体跳过 → training/{data,packers,state}.py
          # 覆盖率 0%，覆盖率预算门禁结构性假红（2026-09-11 修复）。
          pip install datasets einops argbind tensorboard
          pip check
          pip install pytest pytest-asyncio pytest-cov pytest-timeout httpx pytest-github-actions-annotate-failures

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          pip install --upgrade pip
          pip install torch torchvision torchaudio
          pip install -r requirements.txt
          # 训练层测试依赖（= pyproject.toml [training] extra）：缺失时
          # tests/training/* 因 skipif 整体跳过 → training/{data,packers,state}.py
          # 覆盖率 0%，覆盖率预算门禁结构性假红（2026-09-11 修复）。
          pip install datasets einops argbind tensorboard
          pip check
          pip install pytest pytest-asyncio pytest-cov pytest-timeout httpx pytest-github-actions-annotate-failures

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          # 训练层测试依赖（= pyproject.toml [training] extra）：缺失时
          # tests/training/* 因 skipif 整体跳过 → training/{data,packers,state}.py
          # 覆盖率 0%，覆盖率预算门禁结构性假红（2026-09-11 修复）。
          pip install datasets einops argbind tensorboard
          pip check
          pip install pytest pytest-asyncio pytest-cov pytest-timeout httpx pytest-github-actions-annotate-failures
        shell: pwsh

      - name: Run tests with coverage
        env:
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_OFFLINE: "1"
          MODELSCOPE_OFFLINE: "1"
          CUDA_VISIBLE_DEVICES: ""
        run: |
          # 2026-08-31 治理修复（P1-1）：移除 `|| true`，恢复测试与覆盖率门禁的真实阻断。
          # 此前 `--cov-fail-under=40` 的覆盖率门禁被 `|| true` 完全吞掉，覆盖率掉到 0% CI 仍绿，
          # 导致「CI 全绿」无法作为 MLOps 成效的可信指标。恢复后：
          #   - pytest 任一用例失败 → 本 job 变红
          #   - 覆盖率低于 45% → 本 job 变红（门禁真正生效）
          # 2026-09-05 测试体系改进：覆盖率门禁从 40% 上调至 45%（training 修复后实际 47.55%）
          pytest tests/ -v --tb=short --timeout=180 --ignore=tests/e2e --cov=app/integrated_app --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov --cov-fail-under=45 \
            -m "not integration and not gpu and not cuda and not vram and not benchmark and not stress"

      # 2026-09-05 测试体系改进（中期-1）：核心路径覆盖率预算制。
      # 逐模块校验覆盖率预算，低于预算则 CI 失败（防回归底线）。
      # 预算配置: configs/coverage_budget.toml；目标: 核心路径 ≥60%。
      - name: Check coverage budget
        if: runner.os == 'Linux'
        run: |
          python scripts/check_coverage_budget.py coverage.xml --config configs/coverage_budget.toml

      - name: Run benchmark tests
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && runner.os == 'Linux'
        env:
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_OFFLINE: "1"
          MODELSCOPE_OFFLINE: "1"
          CUDA_VISIBLE_DEVICES: ""
        run: |
          # 2026-08-31 治理修复（P1-1）：移除 `|| true`，性能基准失败应真实可见
          pytest tests/benchmarks/ -v --tb=short -m "benchmark"

      - name: Run integration tests
        if: runner.os == 'Linux'
        env:
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_OFFLINE: "1"
          MODELSCOPE_OFFLINE: "1"
          CUDA_VISIBLE_DEVICES: ""
        run: |
          # 2026-08-31 治理修复（P1-1）：移除 `|| true`，集成测试失败应真实可见
          pytest tests/integration/ -v --tb=short --no-header -q \
            -m "not gpu and not cuda and not vram"

      - name: Upload coverage report
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}-${{ runner.os }}
          path: coverage.xml

      - name: Upload coverage to Codecov
        if: always() && runner.os == 'Linux' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: tts-multimodel-coverage
          fail_ci_if_error: false

  build:
    name: Build (sdist/wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: test
    # 2026-08-31 治理修复（P1-1）：移除 continue-on-error，构建失败应真实阻断
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        # 2026-08-31 治理修复（P1-1）：移除 `|| true`，构建失败应真实阻断
        run: python -m build

      - name: Check package metadata
        # 2026-08-31 治理修复（P1-1）：移除 `|| true`，元数据校验失败应真实阻断
        run: twine check dist/*

      - name: 核对 wheel 里有完整性自检三件套
        # 为什么单独查产物：`config.yaml` 默认 enforce=true，而 wheel 若漏打清单/签名/公钥，
        # 装出来的环境里 P0 完整性保护会**一声不响地不运行**（v2.2.2 的 wheel 实测就是这样，
        # 详见 app/integrated_app/security/integrity_selfcheck.py 的分支注释）。
        # 光有 pyproject 的 package-data 声明不算数 —— setuptools 行为一变就谎报了。
        run: |
          set -eu
          python - <<'PY'
          import glob, sys, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(whl).namelist())
          need = [
              "integrated_app/security/integrity_manifest.json",
              "integrated_app/security/integrity_manifest.json.sig.ed25519",
              "integrated_app/security/manifest_signing_public_key.pem",
          ]
          miss = [n for n in need if n not in names]
          for n in need:
              print(("OK   " if n in names else "MISS ") + n)
          if miss:
              print("::error::wheel 缺以上文件 → 安装后 enforce 模式的完整性自检不会运行")
              sys.exit(1)
          print(f"[wheel-integrity] {whl} 含完整性三件套（包内 {len(names)} 项）")
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ── 安全断言（部署安全红线，2026-08-17 新增） ──────────────────
  security-assertions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 2026-08-31 治理修复（P1-1）：移除 continue-on-error，安全红线断言失败应真实阻断
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: 禁止 0.0.0.0 监听
        run: |
          HITS=$(grep -rn --include='*.py' --include='*.bat' --include='*.sh' --include='*.yml' \
            -E "host[[:space:]]*=[[:space:]]*['\"]0\.0\.0\.0|--host[[:space:]]+0\.0\.0\.0" \
            app config.yaml start.bat start.sh 2>/dev/null | grep -v tests || true)
          if [ -n "$HITS" ]; then echo "FAIL: 发现 0.0.0.0 监听配置"; echo "$HITS"; exit 1; fi
          echo "PASS: 无 0.0.0.0 监听配置"
      - name: 入口文件一致性
        run: |
          test -f app/clean_launch.py || test -f backend/main.py || exit 1
          test -f requirements.txt
          echo "PASS: 入口与依赖清单存在"
      - name: 依赖锁存在性
        run: |
          test -f requirements-lock.txt || (echo "FAIL: 缺少 requirements-lock.txt" && exit 1)
          echo "PASS: 依赖锁存在"
