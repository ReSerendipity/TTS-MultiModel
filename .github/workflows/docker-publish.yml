name: Docker Build & Publish

# 镜像供应链（P1-2）：
# - 构建多阶段镜像并推送至 GHCR
# - 打不可变 tag（semver + git sha），彻底消除 "latest 漂移"
# - Trivy 镜像漏洞扫描（HIGH/CRITICAL 阻断发布）
on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# 同一时刻只跑一条镜像构建（2026-09-22 实测的浪费）：13:29 的 main push、14:03 的 main push
# 与 14:12 我为 v2.2.5 手工 dispatch 的那条在同一天里并行 —— 单次构建 20+ 分钟，
# 还要读写同一份 Actions 层缓存（配额只有 10 GiB，曾经就是被这里的缓存吃满的，见 #133）。
# 按 ref 分组的方案我否掉了：实测重叠的两条恰好是**不同 ref**（refs/heads/main 与
# refs/tags/v2.2.5），分组等于没管住。cancel-in-progress 关掉：被中途取消会留下半份层缓存，
# 还可能让 :latest 停在中间态，而 release 那条尤其不能事后取消。
concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-publish:
    name: Build / Scan / Push
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # 注意：镜像不含模型权重（.dockerignore 已排除 model/），
      # 运行时必须挂载权重（见 deploy/kubernetes/ 与 docker-compose.yml）。
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 层缓存的配额账（2026-09-22 实测，别再改回去）：
          #   `mode=max` + 不写 scope 时，本工作流每跑一次就往 Actions 缓存里塞一份
          #   ~3.2 GiB 的全量快照，且**每次的 blob key 都不一样**（内容含构建期元数据），
          #   于是旧快照变成没人再引用但仍计配额 near-duplicate 垃圾。
          #   今天三次构建（main push / v2.2.4 tag push / 又一次 main push）之后：
          #   仓库缓存 9.64 GiB / 配额 10 GiB，其中 9.52 GiB 是 12 条 buildkit-blob，
          #   全挂在 refs/heads/main 下。副作用不是"docker 慢一点"，而是
          #   **LRU 先把小缓存挤掉** —— 性能门禁的 benchmark 基线（2.8 KB）存进去两小时就
          #   `Cache not found`，12 平台矩阵的 setup-python/pip 缓存也没了。
          #   mode=min 只缓存"下一步要用到的"层（base 镜像与依赖层，正是耗时的部分），
          #   不缓存中间产物；固定 scope 让 push/PR/tag 共用一个桶而不是各自开新桶。
          cache-from: type=gha,scope=tts-mm
          cache-to: type=gha,mode=min,scope=tts-mm
          # provenance=false：跳过 SBOM/provenance 内联，缩小镜像并避免与单架构冲突
          provenance: false

      # 镜像引用必须全小写：${{ github.repository }} 展开为 "ReSerendipity/TTS_MultiModel"，
      # 含大写字母，而 OCI 引用规范只允许小写。Trivy 在解析阶段就直接 FATAL
      # （"could not parse reference: ghcr.io/ReSerendipity/TTS_MultiModel:<sha>"），
      # 扫描根本没开始，表现为「HIGH/CRITICAL 门禁失败」的假象（见 run 33526733250）。
      # 另一个隐藏 bug：metadata-action 的 type=sha,format=long 推出的 tag 带 "sha-" 前缀，
      # 直接拼 ":${{ github.sha }}" 指向的是一个并不存在的 tag。
      - name: Resolve immutable scan ref (lowercase)
        id: scanref
        run: |
          ref="$(printf '%s' "${{ env.REGISTRY }}/${{ github.repository }}:sha-${{ github.sha }}" | tr '[:upper:]' '[:lower:]')"
          echo "resolved scan ref: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # Trivy 会先把镜像整体导出到 $TMPDIR 再逐层解包分析。本项目镜像约 10.8GB（压缩层）
      # / 约 25GB（展开），而 runner 构建完成后 / 仅剩约 31G，不清理会
      # "failed to copy the image: ... no space left on device"（见 run 33526733209）。
      - name: Free disk space for scan
        run: |
          docker buildx prune -af || true
          for b in $(docker buildx ls --format '{{.Name}}' | grep -E '^builder-'); do
            docker buildx rm -f "$b" || true
          done
          docker image prune -f
          # 卸掉 runner 预装但本流水线用不到的大型工具链（合计约 25GB）
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost \
            /opt/az /usr/share/swift /usr/local/julia* /usr/local/graalvm /usr/share/miniconda \
            /usr/local/share/powershell /usr/lib/google-cloud-sdk
          df -h / | tail -1

      - name: Trivy image scan (HIGH/CRITICAL gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (SHA pin 防 tag 强更)
        with:
          image-ref: ${{ steps.scanref.outputs.ref }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          # 与 docker-build.yml 用同一份已接受风险清单（每条带理由与 expiration）
          # 输入名 trivyignores：trivy-action v0.36.0 不认 ignorefile（只会警告后忽略）
          trivyignores: ".trivyignore.yaml"
          format: table
          # 只跑漏洞扫描：secret/misconfig 扫描对 25GB 镜像是纯多余开销，会拖长导出与解包时间
          scanners: vuln
          # 本项目镜像约 25GB 展开，Trivy 默认 5m 内部超时会在分析阶段被
          # "context deadline exceeded" 打断（见 dependabot docker/build-push-action-7 PR，
          # 与 docker-build.yml 同步修复）。10m 实测在逐文件分析阶段仍会
          # "semaphore acquire: context deadline exceeded"（run 34766431887），
          # 与 docker-build.yml 同步拉长到 20m。
          timeout: "20m"
