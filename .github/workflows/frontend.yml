name: Frontend Smoke

on:
  push:
    branches: [main, dev]
    paths:
      - 'app/integrated_app/templates/**'
      - 'app/integrated_app/static/**'
      - 'tests/frontend/**'
      - 'tests/scripts/render_pages.py'
      - 'tests/package.json'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/integrated_app/templates/**'
      - 'app/integrated_app/static/**'
      - 'tests/frontend/**'
      - 'tests/scripts/render_pages.py'
      - 'tests/package.json'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-smoke:
    name: Frontend Smoke (jsdom)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 2026-08-31 治理修复（P3）：前端冒烟测试接入 CI。
      # 此前 tests/frontend/smoke.js 与 tests/package.json 的 test:frontend 存在，
      # 但全仓 .github/** 无任何工作流引用 —— "写了不跑"的孤儿测试。
      # 本工作流在触及模板/静态资源的 PR 上强制运行：render_pages.py 只驱动
      # Jinja2 模板环境（不拉起 FastAPI / torch），离线、快速、可阻断。
      - name: Install minimal Python deps
        run: |
          pip install --upgrade pip
          pip install jinja2 pyyaml

      - name: Render pages (Jinja2)
        run: |
          python tests/scripts/render_pages.py

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # 20 -> 24：jsdom 30.x 自己声明的 engines.node 是
          # "^22.22.2 || ^24.15.0 || >=26.0.0"，20 不在支持矩阵里；钉在 20 上
          # Dependabot 的 jsdom bump 必然红在运行时内部（#93 实测：
          # undici/lib/web/cache/cachestorage.js:20 ->
          # TypeError: webidl.util.markAsUncloneable is not a function，
          # 该 Node API 在 20 上不存在）。抬到 24 后本机 Node 24.18 实测
          # 现版本 jsdom 24.1.3 与 30.1.0 均 smoke 8/0 + wiring 10/0。
          node-version: "24"

      - name: Install jsdom
        working-directory: tests
        run: npm install --no-audit --no-fund

      - name: Run frontend smoke tests (jsdom)
        run: node tests/frontend/smoke.js

      # 2026-09-14：生成结果「统一接线」行为测试。
      # tests/test_fe_be_consistency.py 的守卫 6 只证明「流式模板调用了
      # window.wireGenerationResult()」（调用点），本步骤证明该函数本身行为正确
      # （显示 <prefix>-pp-section + 回填 <prefix>-result-audio）。两者互补。
      - name: Run generation-result wiring test (jsdom)
        run: node tests/frontend/wire_generation_result.js

      - name: Upload rendered pages (debug artifact)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-rendered
          path: tests/frontend/_rendered/
          retention-days: 7
