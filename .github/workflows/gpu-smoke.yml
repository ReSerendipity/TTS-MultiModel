# .github/workflows/gpu-smoke.yml
# Weekly + manual REAL-INFERENCE smoke on a self-hosted GPU runner (label: gpu).
#
# 补齐 TTS_MultiModel 在「GPU 真机推理 CI」维度的历史缺口：
# 此前 CI 的 runs-on 全为 GitHub 托管 runner（27 GB 权重无法在 CI 加载），
# 「权重加载失败 / 显存 OOM / CUDA 版本不兼容」三类故障在 CI 中完全不可见。
#
# 设计借鉴 SeedVR2-lite 的 gpu-smoke.yml（runner-precheck + gpu-smoke 双 job）。
# 与 SeedVR2 不同：本项目以 FastAPI 服务形态运行，故真机冒烟 = 拉起真实服务
# （TTS_AUTO_LOAD_MODEL=1 自动加载 voxcpm2）→ 两个引擎各跑一条最短合成 →
# 校验返回的是真实音频字节。
#
# 运行前提（一次性，在 GPU 机器上）：
#   1. 注册 self-hosted runner，额外打 `gpu` label
#      (Settings -> Actions -> Runners -> New self-hosted runner -> --labels gpu)
#   2. 预置 Python 虚拟环境（含 torch CUDA + 本项目依赖）；路径通过仓库变量
#      GPU_SMOKE_VENV 指定（如 /opt/venv-tts/bin）。未配置时回退到默认 python
#      并尝试 pip install -r requirements.txt（不推荐，权重环境应预置）。
#   3. 模型权重就位：model/VoxCPM2、model/IndexTTS2 等目录需存在。
#   4. NVIDIA 驱动可用；约 27 GB 空闲显存（IndexTTS2 全量加载）。
#   5. 仓库 Secrets 配置 REPO_ADMIN_TOKEN（具备 actions:read / admin 权限），
#      供 runner-precheck 查询 runner 在线状态。
# 无 gpu runner 在线时，周更作业经 runner-precheck 优雅跳过（available=false），不会长期飘红。

name: GPU Smoke (real inference, self-hosted)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/sha to smoke (empty = default branch)"
        required: false
        default: ""
  schedule:
    - cron: "0 3 * * 1" # every Monday 03:00 UTC

permissions:
  contents: read
  # smoke-status 要把"本次有没有真推理"写成一条独立 check run（neutral 而非红），
  # 见 jobs.smoke-status。只需本工作流级别的 checks:write，不动仓库设置。
  checks: write

jobs:
  runner-precheck:
    runs-on: ubuntu-latest
    outputs:
      # verdict ∈ {available, no-repo-admin-token-secret, no-registered-gpu-runner,
      #            runner-query-denied}；gpu-smoke 只在 available 时跑。
      verdict: ${{ steps.probe.outputs.verdict }}
    steps:
      - name: Probe GPU runner availability
        id: probe
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          # 这里不再"发个 warning 然后让整条 run 长得像通过"。
          # 2026-09-24 审计实测：REPO_ADMIN_TOKEN 从未配置 + 注册 runner 数 = 0，
          # 于是 3 次 schedule run 全是 gpu-smoke=skipped 而 run 结论 success；
          # docs/DOD.md:225 记的"改成 ::warning + job summary"那一步并不够 ——
          # warning 还是读作成功。现在 precheck 只负责把原因定成机器可读的 verdict，
          # 显式结论由 smoke-status 落成一条 neutral check run。
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "verdict=no-repo-admin-token-secret" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # runners 列表 API 需要管理员级 token（GITHUB_TOKEN 即使 actions:read 也 403）
          COUNT=$(gh api "repos/${{ github.repository }}/actions/runners" \
            --jq '[.runners[] | select(.status == "online") | select(any(.labels[]; .name == "gpu"))] | length' 2>/dev/null || echo "")
          if [ -z "$COUNT" ]; then
            echo "verdict=runner-query-denied" >> "$GITHUB_OUTPUT"
          elif [ "${COUNT}" -gt 0 ]; then
            echo "online gpu-labelled runners: ${COUNT}"
            echo "verdict=available" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=no-registered-gpu-runner" >> "$GITHUB_OUTPUT"
          fi

      - name: "Skip reason: no-repo-admin-token-secret（REPO_ADMIN_TOKEN 未配置）"
        if: steps.probe.outputs.verdict == 'no-repo-admin-token-secret'
        run: |
          echo "::notice::本次没有任何 GPU 真推理：secret REPO_ADMIN_TOKEN 未配置，precheck 无法查询 runner 在线状态。"
          echo "### GPU 真机冒烟未执行" >> "$GITHUB_STEP_SUMMARY"
          echo "\`verdict=no-repo-admin-token-secret\` —— precheck 拿不到管理员级 token，无法判断有没有在线的 \`gpu\` runner。" >> "$GITHUB_STEP_SUMMARY"

      - name: "Skip reason: no-registered-gpu-runner（在线 gpu runner 数为 0）"
        if: steps.probe.outputs.verdict == 'no-registered-gpu-runner'
        run: |
          echo "::notice::本次没有任何 GPU 真推理：仓库里没有在线且带 gpu 标签的 self-hosted runner。"
          echo "### GPU 真机冒烟未执行" >> "$GITHUB_STEP_SUMMARY"
          echo "\`verdict=no-registered-gpu-runner\` —— 查询成功，但在线的 \`gpu\` runner 数为 0。" >> "$GITHUB_STEP_SUMMARY"

  gpu-smoke:
    needs: runner-precheck
    if: needs.runner-precheck.outputs.verdict == 'available'
    runs-on: [self-hosted, gpu]
    timeout-minutes: 150
    env:
      TTS_AUTO_LOAD_MODEL: "1"
      TTS_AUTO_LOAD_ENGINE: "voxcpm2"
      CUDA_VISIBLE_DEVICES: "0"
    steps:
      - name: Fetch source via codeload (avoid git smart-HTTP stall on GPU runner)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $ref = "${{ github.event.inputs.ref || github.ref_name }}"
          if (-not $ref) { $ref = '${{ github.ref_name }}' }
          Invoke-WebRequest "https://codeload.github.com/${{ github.repository }}/tar.gz/refs/heads/$ref" -OutFile src.tgz -UseBasicParsing
          New-Item -ItemType Directory -Path repo -Force | Out-Null
          # Windows 自带 tar（bsdtar）对归档中的中文文件名会报
          # "Invalid empty pathname"（编码缺陷，参见 SeedVR2-lite#86），改用 Python tarfile（UTF-8 安全）解压。
          @'
          import tarfile
          t = tarfile.open("src.tgz", "r:gz")
          members = [m for m in t.getmembers() if not m.isdir()]
          top = members[0].name.split("/")[0] + "/"
          n = 0
          for m in members:
              rel = m.name[len(top):]
              if not rel:
                  continue
              m.name = rel
              try:
                  t.extract(m, "repo", filter="data")
              except TypeError:
                  t.extract(m, "repo")
              n += 1
          print("extracted:", n)
          '@ | python -
          Remove-Item src.tgz -Force
          Get-ChildItem repo | Select-Object Name

      - name: Resolve Python interpreter
        id: py
        shell: pwsh
        run: |
          $venv = "${{ vars.GPU_SMOKE_VENV }}"
          if ($venv -and (Test-Path $venv)) {
            "python=$venv/bin/python" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append
          } else {
            "python=python" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append
          }

      - name: Install deps (fallback if no prebuilt venv configured)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not "${{ vars.GPU_SMOKE_VENV }}") {
            & ${{ steps.py.outputs.python }} -m pip install -r requirements.txt
          } else {
            Write-Host "using prebuilt venv; skipping pip install"
          }

      - name: CUDA / torch sanity gate
        shell: pwsh
        run: |
          & ${{ steps.py.outputs.python }} -c "import torch; assert torch.cuda.is_available(), 'CUDA not available'; print('CUDA', torch.cuda.get_device_name(0))"

      - name: Boot service + GPU real-inference smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          cd repo/app
          $env:PYTHONPATH = (Get-Location).Path
          # 后台拉起真实服务（TTS_AUTO_LOAD_MODEL=1 自动加载 voxcpm2）
          $p = Start-Process -NoNewWindow -PassThru -FilePath ${{ steps.py.outputs.python }} `
            -ArgumentList "-u","-m","integrated_app.app_server","--host","127.0.0.1","--port","7869" `
            -RedirectStandardOutput $env:RUNNER_TEMP/server.log -RedirectStandardError $env:RUNNER_TEMP/server.err
          try {
            # 等待 /readyz（model_loaded 闸门，最长 600s，含权重加载时间）
            $ok = $false
            for ($i=1; $i -le 200; $i++) {
              try { $r = Invoke-WebRequest -Uri http://127.0.0.1:7869/readyz -UseBasicParsing -TimeoutSec 5; if ($r.StatusCode -eq 200) { $ok=$true; break } } catch {}
              Start-Sleep -Seconds 3
            }
            if (-not $ok) { Write-Host "=== server.log ==="; Get-Content $env:RUNNER_TEMP/server.log -Tail 100; throw "service not ready within 600s" }
            Write-Host "service ready"
            # 跑真机冒烟：voxcpm2 + indextts2 各一条最短真实合成
            & ${{ steps.py.outputs.python }} ../scripts/gpu_smoke_minimal.py --base-url http://127.0.0.1:7869 --output gpu_smoke_report.json
            $rc = $LASTEXITCODE
            if ($rc -ne 0) { throw "GPU smoke failed (rc=$rc)" }
          } finally {
            if (-not $p.HasExited) { $p.Kill() }
          }

      - name: Training minimal smoke (1-step LoRA fine-tune)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          cd repo
          # 训练依赖（datasets / einops / argbind / tensorboard）
          & ${{ steps.py.outputs.python }} -m pip install -e ".[training]"
          # 1 步 LoRA 训练冒烟：合成数据集 → 训练 1 步 → 校验 checkpoint 非空
          & ${{ steps.py.outputs.python }} scripts/gpu_training_smoke.py --pretrained model/VoxCPM2 --timeout 600
          if ($LASTEXITCODE -ne 0) { throw "training smoke failed (rc=$LASTEXITCODE)" }

      - name: Report GPU status
        if: always()
        shell: pwsh
        run: |
          nvidia-smi || true

      - name: Upload smoke report + server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-smoke-report-${{ github.run_number }}
          path: |
            repo/app/gpu_smoke_report.json
            ${{ runner.temp }}/server.log
            ${{ runner.temp }}/server.err
          if-no-files-found: ignore
          retention-days: 7

  smoke-status:
    # 把"这一轮到底有没有跑成真 GPU 推理"落成一眼可读的结论：一条独立的 check run
    # （名字自带 ASCII 原因码）+ run 页面摘要。用 neutral 而不是 exit 1 ——
    # 注册 runner 属基础设施决策，每周红一次不是目标；但 success + warning 也不行，
    # 因为它读起来就是"过了"。check 名用 ASCII：本仓在 Windows 控制台与文档里
    # 多次栽过非 ASCII 编码（release-gate 的 cp1252、bsdtar 中文名），不再引入新变量。
    name: GPU real-inference attestation
    needs: [runner-precheck, gpu-smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish verdict as a neutral check run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERDICT: ${{ needs.runner-precheck.outputs.verdict }}
          SMOKE: ${{ needs.gpu-smoke.result }}
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # precheck 自己挂掉时 verdict 会是空串 —— 别让它落成一个读不出原因的裸名字。
          VERDICT="${VERDICT:-precheck-did-not-report}"
          SMOKE="${SMOKE:-unknown}"
          case "${SMOKE}/${VERDICT}" in
            success/*)                          CONCL=success;   NAME="[gpu-smoke] REAL inference executed and passed" ;;
            failure/*)                          CONCL=failure;   NAME="[gpu-smoke] REAL inference executed and FAILED" ;;
            cancelled/*)                        CONCL=cancelled; NAME="[gpu-smoke] real inference cancelled" ;;
            skipped/no-repo-admin-token-secret) CONCL=neutral;   NAME="[gpu-smoke] NO REAL INFERENCE - no-repo-admin-token-secret" ;;
            skipped/no-registered-gpu-runner)   CONCL=neutral;   NAME="[gpu-smoke] NO REAL INFERENCE - no-registered-gpu-runner" ;;
            skipped/runner-query-denied)        CONCL=neutral;   NAME="[gpu-smoke] NO REAL INFERENCE - runner-query-denied (token lacks rights)" ;;
            skipped/*)                          CONCL=neutral;   NAME="[gpu-smoke] NO REAL INFERENCE - ${VERDICT}" ;;
            *)                                  CONCL=neutral;   NAME="[gpu-smoke] status unknown (${SMOKE}/${VERDICT})" ;;
          esac

          {
            echo "## GPU 真机推理结论：${NAME}"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| gpu-smoke job 结果 | ${SMOKE} |"
            echo "| precheck verdict | ${VERDICT} |"
            echo "| check conclusion | ${CONCL} |"
            echo ""
            echo "整条 run 的 Success 不代表真推理跑过 —— 本条 check 才是结论。"
          } >> "$GITHUB_STEP_SUMMARY"

          # 写不进去就是自证机制本身坏了，这种情况要红（它和"没有真推理"是两回事）。
          if ! gh api -X POST "repos/${{ github.repository }}/check-runs"               -f "name=${NAME}"               -f "head_sha=${HEAD_SHA}"               -f status=completed               -f "conclusion=${CONCL}"               -f "html_url=${RUN_URL}"               -f "external_id=gpu-smoke-${{ github.run_id }}-${{ github.run_attempt }}"               -f "title=GPU smoke - real inference attestation"               -f "summary=${NAME} | verdict=${VERDICT} | gpu-smoke=${SMOKE} | run=${RUN_URL}" >/dev/null; then
            echo "::error::check run 写入失败：需要 permissions.checks=write。自证链路断了，必须显眼。"
            exit 1
          fi
          echo "已发布 check run：${NAME} -> conclusion=${CONCL}"
