# .github/workflows/quality.yml
# 周度 golden-set 质量基线（self-hosted Windows GPU runner）。
#
# 与 gpu-smoke.yml 的分工：
#   - gpu-smoke：证明"服务能起、引擎能出真音频"（一条最短合成，契约校验）。
#   - quality  ：证明"音频内容没有悄悄退化"（10 条固定文本真合成，
#                对比时长/RTF/字节/sha256 与已提交基线 configs/golden_baseline.voxcpm2.ref.json）。
#
# 失败边界（重要）：
#   - 内容漂移 = 红（本 job fail）：非 200、时长漂移 >20%、mean RTF 较基线劣化 >30%。
#   - sha256 漂移 = 黄（::warning::，不 fail）：CUDA/driver 版本差异会让浮点比特微动，
#     属于正常现象，只记录不阻断。
#   - 环境问题 = 黄（::warning::，不 fail）：CUDA 不可用、服务 600s 未就绪、OOM。
#     这类是 runner 基础设施问题，不是模型退化，不该让周更长期飘红；
#     用 ENV_PROBLEM=1 跳过内容对比，直接出摘要。
#
# 运行前提：self-hosted runner 标签 [self-hosted, Windows, GPU]，
# Python venv 经仓库变量 QUALITY_PYTHON 指定（否则回退仓库内 .venv\Scripts\python.exe），
# model/VoxCPM2 权重就位。
#
# runner 可用性（NEXT 评估 P1-2）：runner-precheck 查询在线 GPU runner；无 runner /
# 无 REPO_ADMIN_TOKEN 时优雅跳过并落 neutral check run（名字自带 ASCII 原因码），
# 避免 gpu-smoke 曾出现过的「3 次 schedule 全 skip 而 run 结论 success」教训
# （docs/DOD.md:225）。quality-status 才是「本周到底有没有跑成真合成」的权威结论。

name: Quality golden baseline (self-hosted Windows GPU)

on:
  workflow_dispatch:
  schedule:
    - cron: "33 5 * * 2" # every Tuesday 05:33 UTC（错开周一 gpu-smoke）

permissions:
  contents: read
  # quality-status 要把"本周有没有真跑 golden"写成一条独立 check run（neutral 而非红）
  checks: write

jobs:
  runner-precheck:
    runs-on: ubuntu-latest
    outputs:
      # verdict ∈ {available, no-repo-admin-token-secret, no-registered-gpu-runner, runner-query-denied}
      verdict: ${{ steps.probe.outputs.verdict }}
    steps:
      - name: Probe GPU runner availability
        id: probe
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "verdict=no-repo-admin-token-secret" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COUNT=$(gh api "repos/${{ github.repository }}/actions/runners" \
            --jq '[.runners[] | select(.status == "online") | select(any(.labels[]; (.name | ascii_downcase) == "gpu"))] | length' 2>/dev/null || echo "")
          if [ -z "$COUNT" ]; then
            echo "verdict=runner-query-denied" >> "$GITHUB_OUTPUT"
          elif [ "${COUNT}" -gt 0 ]; then
            echo "online gpu-labelled runners: ${COUNT}"
            echo "verdict=available" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=no-registered-gpu-runner" >> "$GITHUB_OUTPUT"
          fi

      - name: "Skip reason: no-repo-admin-token-secret"
        if: steps.probe.outputs.verdict == 'no-repo-admin-token-secret'
        run: |
          echo "::notice::本次没有任何 GPU 真合成：secret REPO_ADMIN_TOKEN 未配置，precheck 无法查询 runner 在线状态。"
          echo "### 周度 golden 未执行" >> "$GITHUB_STEP_SUMMARY"
          echo "\`verdict=no-repo-admin-token-secret\` —— precheck 拿不到管理员级 token，无法判断有没有在线的 \`gpu\` runner。" >> "$GITHUB_STEP_SUMMARY"

      - name: "Skip reason: no-registered-gpu-runner"
        if: steps.probe.outputs.verdict == 'no-registered-gpu-runner'
        run: |
          echo "::notice::本次没有任何 GPU 真合成：仓库里没有在线且带 gpu 标签的 self-hosted runner。"
          echo "### 周度 golden 未执行" >> "$GITHUB_STEP_SUMMARY"
          echo "\`verdict=no-registered-gpu-runner\` —— 查询成功，但在线的 \`gpu\` runner 数为 0。" >> "$GITHUB_STEP_SUMMARY"

  quality-golden:
    needs: runner-precheck
    if: needs.runner-precheck.outputs.verdict == 'available'
    runs-on: [self-hosted, Windows, GPU]
    timeout-minutes: 45
    env:
      TTS_AUTO_LOAD_MODEL: "1"
      TTS_AUTO_LOAD_ENGINE: "voxcpm2"
      CUDA_VISIBLE_DEVICES: "0"
      QUALITY_PORT: "7869"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Python interpreter
        id: py
        shell: pwsh
        run: |
          $py = "${{ vars.QUALITY_PYTHON }}"
          if (-not $py -or -not (Test-Path $py)) {
            $py = ".venv\Scripts\python.exe"
          }
          "python=$py" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append
          Write-Host "using python: $py"

      - name: CUDA sanity gate（环境问题=黄，不 fail）
        id: cuda
        shell: pwsh
        run: |
          try {
            & ${{ steps.py.outputs.python }} -c "import torch; assert torch.cuda.is_available(); print('CUDA', torch.cuda.get_device_name(0))"
            echo "ENV_PROBLEM=" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
          } catch {
            Write-Host "::warning::CUDA 不可用（环境问题，黄，不阻断）：$_"
            echo "ENV_PROBLEM=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
          }

      - name: Boot service + run golden set（内容漂移=红，环境=黄）
        id: run
        shell: pwsh
        env:
          RUN_ENV_PROBLEM: ${{ env.ENV_PROBLEM }}
        run: |
          $ErrorActionPreference = 'Continue'
          if ($env:RUN_ENV_PROBLEM -eq '1') {
            Write-Host "::warning::跳过真合成（上游已标记环境问题）"
            exit 0
          }
          cd app
          $env:PYTHONPATH = (Get-Location).Path
          $p = Start-Process -NoNewWindow -PassThru -FilePath ${{ steps.py.outputs.python }} `
            -ArgumentList "-u","-m","integrated_app.app_server","--host","127.0.0.1","--port","$env:QUALITY_PORT" `
            -RedirectStandardOutput $env:RUNNER_TEMP/qt_server.log -RedirectStandardError $env:RUNNER_TEMP/qt_server.err
          try {
            $ok = $false
            for ($i=1; $i -le 200; $i++) {
              try { $r = Invoke-WebRequest -Uri "http://127.0.0.1:$env:QUALITY_PORT/readyz" -UseBasicParsing -TimeoutSec 5; if ($r.StatusCode -eq 200) { $ok=$true; break } } catch {}
              Start-Sleep -Seconds 3
            }
            if (-not $ok) {
              Write-Host "=== server.log ==="; Get-Content $env:RUNNER_TEMP/qt_server.log -Tail 80 -ErrorAction SilentlyContinue
              Write-Host "::warning::服务 600s 未就绪（环境问题，黄，不阻断）"
              echo "ENV_PROBLEM=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
              exit 0
            }
            Write-Host "service ready，跑 golden set..."
            & ${{ steps.py.outputs.python }} ../scripts/gpu_golden_baseline.py `
              --base-url "http://127.0.0.1:$env:QUALITY_PORT" `
              --model tts-1 --output ../golden_baseline.json --timeout 120 `
              --save-wav-dir ../golden_wavs
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::warning::golden 脚本未全部 200（环境/运行问题，黄，不阻断内容对比）"
              echo "ENV_PROBLEM=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
            }
            # 多模型 measure-only pass（NEXT 评估 P1-1：中英 × 多音色）。
            # 不参与红黄判定（ref 未积累），只落 artifact 供后续积累基线。
            & ${{ steps.py.outputs.python }} ../scripts/gpu_golden_baseline.py `
              --base-url "http://127.0.0.1:$env:QUALITY_PORT" `
              --cases ../configs/golden_cases.multimodel.json `
              --output ../golden_baseline.multimodel.json --timeout 120 `
              --save-wav-dir ../golden_wavs_multimodel
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::warning::多模型 pass 未全部 200（多为 persona 未授权 403，见用例文件 _comment）"
            }
          } finally {
            if (-not $p.HasExited) { $p.Kill() }
          }

      - name: MOS 离线评分（可选口径，缺 UTMOS=黄 skip，NEXT 评估 P0-1）
        if: env.ENV_PROBLEM != '1'
        shell: pwsh
        run: |
          & ${{ steps.py.outputs.python }} scripts/gpu_golden_mos.py `
            --wav-dir golden_wavs --output golden_mos.json --merge golden_baseline.json
          $rc = $LASTEXITCODE
          if ($rc -eq 3) {
            Write-Host "::warning::UTMOS2 未安装，MOS 感知评分跳过（黄，不阻断；基线待积累）"
          } elseif ($rc -ne 0) {
            throw "MOS 评分异常 rc=$rc"
          }

      - name: Compare against baseline（内容漂移=红，fail）
        if: env.ENV_PROBLEM != '1'
        shell: pwsh
        run: |
          & ${{ steps.py.outputs.python }} scripts/gpu_golden_compare.py `
            --measured golden_baseline.json `
            --ref configs/golden_baseline.voxcpm2.ref.json `
            --junit golden_baseline.junit.xml
          if ($LASTEXITCODE -eq 2) { throw "内容漂移（红）：见上方 [RED] 列表" }
          if ($LASTEXITCODE -ne 0) { throw "对比脚本异常 rc=$LASTEXITCODE" }

      - name: Streaming TTFB gate（首包延迟回归=红，环境=黄，NEXT 评估 P0-2）
        if: env.ENV_PROBLEM != '1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cd app
          $env:PYTHONPATH = (Get-Location).Path
          $p = Start-Process -NoNewWindow -PassThru -FilePath ${{ steps.py.outputs.python }} `
            -ArgumentList "-u","-m","integrated_app.app_server","--host","127.0.0.1","--port","$env:QUALITY_PORT" `
            -RedirectStandardOutput $env:RUNNER_TEMP/qt_stream.log -RedirectStandardError $env:RUNNER_TEMP/qt_stream.err
          try {
            $ok = $false
            for ($i=1; $i -le 200; $i++) {
              try { $r = Invoke-WebRequest -Uri "http://127.0.0.1:$env:QUALITY_PORT/readyz" -UseBasicParsing -TimeoutSec 5; if ($r.StatusCode -eq 200) { $ok=$true; break } } catch {}
              Start-Sleep -Seconds 3
            }
            if (-not $ok) { throw "服务 600s 未就绪（流式门禁）" }
            & ${{ steps.py.outputs.python }} ../perf/streaming-baseline.py `
              --host 127.0.0.1 --port $env:QUALITY_PORT --repeats 5 --chars 200
            if ($LASTEXITCODE -ne 0) { throw "streaming-baseline 测量失败 rc=$LASTEXITCODE" }
            $latest = Get-ChildItem ../perf/results/streaming-baseline_*.json |
              Sort-Object LastWriteTime | Select-Object -Last 1
            & ${{ steps.py.outputs.python }} ../scripts/streaming_ttfb_gate.py `
              $latest.FullName --baseline ../baselines/streaming-ttfb-baseline.json
            if ($LASTEXITCODE -ne 0) { throw "流式首包延迟回归（红）" }
          } finally {
            if (-not $p.HasExited) { $p.Kill() }
          }

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          echo "### Quality golden baseline" >> $env:GITHUB_STEP_SUMMARY
          if ("$env:ENV_PROBLEM" -eq "1") {
            echo "- 结论：**黄 / 环境问题**（runner 基础设施，非模型退化）" >> $env:GITHUB_STEP_SUMMARY
          } else {
            echo "- 结论：**绿 / 内容无硬漂移**（sha 软警告见 junit）" >> $env:GITHUB_STEP_SUMMARY
          }
          if (Test-Path golden_baseline.json) {
            Get-Content golden_baseline.json | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload junit + measured + server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-golden-${{ github.run_number }}
          path: |
            golden_baseline.json
            golden_baseline.junit.xml
            golden_baseline.multimodel.json
            ${{ runner.temp }}/qt_server.log
            ${{ runner.temp }}/qt_server.err
          if-no-files-found: ignore
          retention-days: 14

  quality-status:
    # 把"这一轮到底有没有跑成 golden 真合成"落成一眼可读的结论：一条独立的 check run
    # （名字自带 ASCII 原因码）。用 neutral 而不是 exit 1 —— 注册 runner 属基础设施决策，
    # 每周红一次不是目标；但 success + warning 也不行。check 名用 ASCII（本仓在 Windows
    # 控制台与文档里多次栽过非 ASCII 编码）。
    name: Quality golden baseline attestation
    needs: [runner-precheck, quality-golden]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish verdict as a neutral check run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERDICT: ${{ needs.runner-precheck.outputs.verdict }}
          GOLDEN: ${{ needs.quality-golden.result }}
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          VERDICT="${VERDICT:-precheck-did-not-report}"
          GOLDEN="${GOLDEN:-unknown}"
          case "${GOLDEN}/${VERDICT}" in
            success/*)                          CONCL=success;   NAME="[quality-golden] REAL synthesis executed and passed" ;;
            failure/*)                          CONCL=failure;   NAME="[quality-golden] REAL synthesis executed and FAILED" ;;
            cancelled/*)                        CONCL=cancelled; NAME="[quality-golden] real synthesis cancelled" ;;
            skipped/no-repo-admin-token-secret) CONCL=neutral;   NAME="[quality-golden] NO REAL SYNTHESIS - no-repo-admin-token-secret" ;;
            skipped/no-registered-gpu-runner)   CONCL=neutral;   NAME="[quality-golden] NO REAL SYNTHESIS - no-registered-gpu-runner" ;;
            skipped/runner-query-denied)        CONCL=neutral;   NAME="[quality-golden] NO REAL SYNTHESIS - runner-query-denied (token lacks rights)" ;;
            skipped/*)                          CONCL=neutral;   NAME="[quality-golden] NO REAL SYNTHESIS - ${VERDICT}" ;;
            *)                                  CONCL=neutral;   NAME="[quality-golden] status unknown (${GOLDEN}/${VERDICT})" ;;
          esac

          {
            echo "## 周度 golden 真合成结论：${NAME}"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| quality-golden job 结果 | ${GOLDEN} |"
            echo "| precheck verdict | ${VERDICT} |"
            echo "| check conclusion | ${CONCL} |"
            echo ""
            echo "整条 run 的 Success 不代表真合成跑过 —— 本条 check 才是结论。"
          } >> "$GITHUB_STEP_SUMMARY"

          if ! gh api -X POST "repos/${{ github.repository }}/check-runs"               -f "name=${NAME}"               -f "head_sha=${HEAD_SHA}"               -f status=completed               -f "conclusion=${CONCL}"               -f "html_url=${RUN_URL}"               -f "external_id=quality-golden-${{ github.run_id }}-${{ github.run_attempt }}"               -f "title=Quality golden baseline - real synthesis attestation"               -f "summary=${NAME} | verdict=${VERDICT} | quality-golden=${GOLDEN} | run=${RUN_URL}" >/dev/null; then
            echo "::error::check run 写入失败：需要 permissions.checks=write。自证链路断了，必须显眼。"
            exit 1
          fi
          echo "已发布 check run：${NAME} -> conclusion=${CONCL}"
