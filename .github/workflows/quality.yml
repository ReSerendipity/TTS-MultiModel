# .github/workflows/quality.yml
# 周度 golden-set 质量基线（self-hosted Windows GPU runner）。
#
# 与 gpu-smoke.yml 的分工：
#   - gpu-smoke：证明"服务能起、引擎能出真音频"（一条最短合成，契约校验）。
#   - quality  ：证明"音频内容没有悄悄退化"（10 条固定文本真合成，
#                对比时长/RTF/字节/sha256 与已提交基线 configs/golden_baseline.voxcpm2.ref.json）。
#
# 失败边界（重要）：
#   - 内容漂移 = 红（本 job fail）：非 200、时长漂移 >20%、mean RTF 较基线劣化 >30%。
#   - sha256 漂移 = 黄（::warning::，不 fail）：CUDA/driver 版本差异会让浮点比特微动，
#     属于正常现象，只记录不阻断。
#   - 环境问题 = 黄（::warning::，不 fail）：CUDA 不可用、服务 600s 未就绪、OOM。
#     这类是 runner 基础设施问题，不是模型退化，不该让周更长期飘红；
#     用 ENV_PROBLEM=1 跳过内容对比，直接出摘要。
#
# 运行前提：self-hosted runner 标签 [self-hosted, Windows, GPU]，
# Python venv 经仓库变量 QUALITY_PYTHON 指定（否则回退仓库内 .venv\Scripts\python.exe），
# model/VoxCPM2 权重就位。

name: Quality golden baseline (self-hosted Windows GPU)

on:
  workflow_dispatch:
  schedule:
    - cron: "33 5 * * 2" # every Tuesday 05:33 UTC（错开周一 gpu-smoke）

permissions:
  contents: read

jobs:
  quality-golden:
    runs-on: [self-hosted, Windows, GPU]
    timeout-minutes: 45
    env:
      TTS_AUTO_LOAD_MODEL: "1"
      TTS_AUTO_LOAD_ENGINE: "voxcpm2"
      CUDA_VISIBLE_DEVICES: "0"
      QUALITY_PORT: "7869"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Python interpreter
        id: py
        shell: pwsh
        run: |
          $py = "${{ vars.QUALITY_PYTHON }}"
          if (-not $py -or -not (Test-Path $py)) {
            $py = ".venv\Scripts\python.exe"
          }
          "python=$py" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append
          Write-Host "using python: $py"

      - name: CUDA sanity gate（环境问题=黄，不 fail）
        id: cuda
        shell: pwsh
        run: |
          try {
            & ${{ steps.py.outputs.python }} -c "import torch; assert torch.cuda.is_available(); print('CUDA', torch.cuda.get_device_name(0))"
            echo "ENV_PROBLEM=" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
          } catch {
            Write-Host "::warning::CUDA 不可用（环境问题，黄，不阻断）：$_"
            echo "ENV_PROBLEM=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
          }

      - name: Boot service + run golden set（内容漂移=红，环境=黄）
        id: run
        shell: pwsh
        env:
          RUN_ENV_PROBLEM: ${{ env.ENV_PROBLEM }}
        run: |
          $ErrorActionPreference = 'Continue'
          if ($env:RUN_ENV_PROBLEM -eq '1') {
            Write-Host "::warning::跳过真合成（上游已标记环境问题）"
            exit 0
          }
          cd app
          $env:PYTHONPATH = (Get-Location).Path
          $p = Start-Process -NoNewWindow -PassThru -FilePath ${{ steps.py.outputs.python }} `
            -ArgumentList "-u","-m","integrated_app.app_server","--host","127.0.0.1","--port","$env:QUALITY_PORT" `
            -RedirectStandardOutput $env:RUNNER_TEMP/qt_server.log -RedirectStandardError $env:RUNNER_TEMP/qt_server.err
          try {
            $ok = $false
            for ($i=1; $i -le 200; $i++) {
              try { $r = Invoke-WebRequest -Uri "http://127.0.0.1:$env:QUALITY_PORT/readyz" -UseBasicParsing -TimeoutSec 5; if ($r.StatusCode -eq 200) { $ok=$true; break } } catch {}
              Start-Sleep -Seconds 3
            }
            if (-not $ok) {
              Write-Host "=== server.log ==="; Get-Content $env:RUNNER_TEMP/qt_server.log -Tail 80 -ErrorAction SilentlyContinue
              Write-Host "::warning::服务 600s 未就绪（环境问题，黄，不阻断）"
              echo "ENV_PROBLEM=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
              exit 0
            }
            Write-Host "service ready，跑 golden set..."
            & ${{ steps.py.outputs.python }} ../scripts/gpu_golden_baseline.py `
              --base-url "http://127.0.0.1:$env:QUALITY_PORT" `
              --model tts-1 --output ../golden_baseline.json --timeout 120
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::warning::golden 脚本未全部 200（环境/运行问题，黄，不阻断内容对比）"
              echo "ENV_PROBLEM=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
            }
          } finally {
            if (-not $p.HasExited) { $p.Kill() }
          }

      - name: Compare against baseline（内容漂移=红，fail）
        if: env.ENV_PROBLEM != '1'
        shell: pwsh
        run: |
          & ${{ steps.py.outputs.python }} scripts/gpu_golden_compare.py `
            --measured golden_baseline.json `
            --ref configs/golden_baseline.voxcpm2.ref.json `
            --junit golden_baseline.junit.xml
          if ($LASTEXITCODE -eq 2) { throw "内容漂移（红）：见上方 [RED] 列表" }
          if ($LASTEXITCODE -ne 0) { throw "对比脚本异常 rc=$LASTEXITCODE" }

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          echo "### Quality golden baseline" >> $env:GITHUB_STEP_SUMMARY
          if ("$env:ENV_PROBLEM" -eq "1") {
            echo "- 结论：**黄 / 环境问题**（runner 基础设施，非模型退化）" >> $env:GITHUB_STEP_SUMMARY
          } else {
            echo "- 结论：**绿 / 内容无硬漂移**（sha 软警告见 junit）" >> $env:GITHUB_STEP_SUMMARY
          }
          if (Test-Path golden_baseline.json) {
            Get-Content golden_baseline.json | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload junit + measured + server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-golden-${{ github.run_number }}
          path: |
            golden_baseline.json
            golden_baseline.junit.xml
            ${{ runner.temp }}/qt_server.log
            ${{ runner.temp }}/qt_server.err
          if-no-files-found: ignore
          retention-days: 14
