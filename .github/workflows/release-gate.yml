name: release-gate

# 发布门禁五步（任务书阶段四 / 报告2 §4.1）：
#   ① 构建  ② 拆包验证（清单完整 + 公钥验签） ③ 负向断言（无密钥/私钥/残留）
#   ④ 篡改模拟（改 1 字节 → 校验失败） ⑤ 冒烟启动（自检 + Ed25519 验签）
# 实现：scripts/release_gate.ps1 + scripts/diag_integrity.py
#
# 触发：workflow_dispatch / 推送 tag v*。
# 2026-10-12：仓库的 self-hosted runner 已下线，real 模式（依赖本机 D:\model 权重与
# D:\tts-wheels、需 ≥60GB 磁盘）一并移除，门禁只在 windows-latest 上跑 fixture 模式。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  gate:
    name: Release gate (fixture)
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    # windows runner 的控制台默认 cp1252，中文 print 会抛 UnicodeEncodeError
    # （历史红：run 35344911236）。与 scripts/*.py 内的 sys.stdout.reconfigure 互为双保险。
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cryptography (Ed25519 验签依赖)
        run: |
          python -m pip install --upgrade pip
          python -m pip install cryptography

      - name: '①-⑤ 发布门禁'
        run: |
          .\scripts\release_gate.ps1 -PythonExe (Get-Command python).Source
        shell: pwsh

      - name: '⑤ 补充：diag 对仓库 app 输出（可二分定位）'
        run: |
          python scripts\diag_integrity.py --app-dir app\integrated_app
