name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: python
          package-name: tts-multimodel
          # Read changelog from CHANGELOG.md
          changelog-path: CHANGELOG.md
          # Use Conventional Commits
          include-component-in-tag: false
          # Don't release automatically; create PR for review
          target-branch: master
          # Release as draft for manual approval
          draft: false
          # PR labels
          label: release
          # Skip CI on release commits
          prerelease: false

  # After release is created, build and upload artifacts
  build-release:
    name: Build Release Artifacts
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check package metadata
        run: twine check dist/*

      # P1 安全修复：生成发布物 SHA256 校验文件
      - name: Generate SHA256SUMS for release artifacts
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # P1 安全修复：生成关键脚本 SHA256 校验文件
      - name: Generate SHA256SUMS for scripts
        run: |
          sha256sum start.bat app/start_app.bat app/clean_launch.py > SHA256SUMS.scripts
          cat SHA256SUMS.scripts

      # P1 安全修复：GPG 签名校验文件（如配置了签名密钥）
      - name: GPG sign SHA256SUMS
        if: env.GPG_SIGNING_KEY != ''
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_SIGNING_KEY" | gpg --import --batch --passphrase "$GPG_PASSPHRASE"
          gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --detach-sign --armor dist/SHA256SUMS
          gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --detach-sign --armor SHA256SUMS.scripts
          echo "GPG 签名完成"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            SHA256SUMS.scripts
            SHA256SUMS.scripts.sig
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          generate_release_notes: true
          body: |
            ## 🔐 完整性验证

            下载发布物后，请验证 SHA256 校验和：

            ```bash
            # Linux/macOS
            sha256sum -c SHA256SUMS

            # Windows PowerShell
            Get-FileHash -Algorithm SHA256 dist/*.whl
            #对比 SHA256SUMS 文件中的值
            ```

            如已导入官方 GPG 公钥，可验证签名：
            ```bash
            gpg --verify SHA256SUMS.sig SHA256SUMS
            ```

            ---

