name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # release-gate 那一步要把检查结论写成 commit status 打在 release PR 的 head 上。
  # 为什么非得用 status 而不是普通 workflow 检查：release-please 自己开的 PR **拿不到任何 CI** ——
  # GitHub 固定行为，由 GITHUB_TOKEN 产生的提交不再级联触发 workflow（实测 #120 / #132 的
  # `gh pr checks` 都是空）。没有这个 status，"这条 release PR 合下去会让 main 立刻变红"
  # 这件事就只能靠人在合并前自己跑一遍脚本记着。
  statuses: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    # 曾经这里是 continue-on-error: true：发版空转与发版失败在 UI 上无法区分，
    # v2.2.2 因此在三次「绿色」的 main push 后始终没有 Release。不要再加回来。
    # build-release 靠 needs.release-please.outputs.* 把关，**但这个 job 此前从未声明 outputs: 块**
    # → 引用恒为空 → 即便 RP 正常发了版，sdist/wheel + SHA256SUMS 那一步也永远不跑
    # （后面 `tag_name: needs.release-please.outputs.tag_name` 同样取不到值）。
    # 输出名按官方文档为下划线式：release_created / tag_name / version / pr。
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    env:
      GIT_AUTHOR_NAME: ReSerendipity
      GIT_AUTHOR_EMAIL: 259081123+ReSerendipity@users.noreply.github.com
      GIT_COMMITTER_NAME: ReSerendipity
      GIT_COMMITTER_EMAIL: 259081123+ReSerendipity@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          # RP 靠 tag 定位"上一个 release"。默认 fetch-depth=1 拿不到 tag，
          # 于是它看不见已发布版本 → 静默判定"无事可做"（这正是空转的一半成因）。
          fetch-depth: 0
          persist-credentials: true

      - name: 发版链路自证（配置在位 + manifest 与最新 tag 对齐）
        # WHY：这条作业曾经"永远绿却什么都不做"——`skip-github-pull-request: true` 让它只认
        # 「已合并的 release PR」，而仓库从没产生过任何一个，于是每次 main push 都是
        # `found 0 possible releases` + success（v2.2.2 就是这么拖了三次）。
        # 这里把"配置是否真的被 RP 读到"变成硬条件，别让下一次静默失效重演。
        run: |
          set -eu
          for f in release-please-config.json .release-please-manifest.json; do
            test -f "$f" || { echo "::error::缺 $f —— 没有它 v4 只按内置默认跑，with: 里的传参不保证生效"; exit 1; }
            python -c "import json;json.load(open('$f'))" || { echo "::error::$f 不是合法 JSON"; exit 1; }
          done
          manifest=$(python -c "import json;print(json.load(open('.release-please-manifest.json'))['.'])")
          latest=$(git tag --list 'v[0-9]*' --sort=-creatordate | head -1 | sed 's/^v//')
          echo "manifest=$manifest  最新 tag=v$latest"
          if [ -z "$latest" ]; then echo "::error::仓库里没有任何 v* tag，RP 无从定位上一个 release"; exit 1; fi
          smaller=$(printf '%s\n%s\n' "$manifest" "$latest" | sort -V | head -1)
          if [ "$smaller" = "$manifest" ] && [ "$manifest" != "$latest" ]; then
            echo "::error::manifest=$manifest 落后于最新 tag=v$latest —— RP 会把已发布过的版本再算一遍，必须把 manifest 抬到已发布版本"
            exit 1
          fi
          if [ "$manifest" != "$latest" ]; then
            echo "::warning::manifest=$manifest 领先于最新 tag=v$latest —— 发版进行中的正常状态；长期如此说明 RP 打了提交却没打上 tag"
          fi

      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          # 只保留 v4 真认的入参。原先这里还传了 package-name / changelog-path / draft /
          # label / prerelease —— 日志里 `Unexpected input(s) ... valid inputs are [...]`
          # 说明它们被整体忽略，配置得写在 release-please-config.json 里。
          # 也不再设 skip-github-pull-request: true：那种模式下 RP 只从"已合并的 release PR"
          # 发版，没有 PR 就永远静默无事可做。
          target-branch: main
          include-component-in-tag: false

      - name: 把结果写进 job 摘要（别让"什么都没发生"再长成一次成功）
        env:
          CREATED: ${{ steps.rp.outputs.release_created || '' }}
          PR: ${{ steps.rp.outputs.pr || '' }}
          TAG: ${{ steps.rp.outputs.tag_name || '' }}
          VERSION: ${{ steps.rp.outputs.version || '' }}
        run: |
          set -eu
          {
            echo "## release-please"
            echo
            echo "- release_created: \`${CREATED:-false}\`"
            echo "- release PR: \`${PR:-（本次没有开）}\`"
            echo "- tag: \`${TAG:-无}\`（version \`${VERSION:-—}\`）"
            if [ -z "$CREATED" ] && [ -z "$PR" ]; then
              echo
              echo "> 本次既没发版也没开发版 PR：正常情况下等于「自上一个 release 起没有符合约定式的提交」。"
              echo "> 若你刚合了 feat/fix，那就是失同步 —— 先看上面「发版链路自证」那步的 manifest/tag 结论。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 发布条件检查（把结论写成 release PR head 上的 commit status）
        # 判据不在这里重写：调 scripts/check_release_readiness.py，它复用
        # tests/test_version_consistency.py 的那 8 条 —— CI 里红的与发版前拦的必须同源。
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
                 --jq '.[] | select(.head.ref == "release-please--branches--main") | .number' | head -1)
          if [ -z "${pr:-}" ]; then
            echo "没有待合的 release PR，跳过发布条件检查。"
            exit 0
          fi
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/$pr" --jq .head.sha)
          wt="$RUNNER_TEMP/release-pr-$pr"
          rm -rf "$wt"
          git config --global --add safe.directory "$wt" || true
          git fetch -q origin "refs/pull/$pr/head"
          git worktree add -q --detach "$wt" FETCH_HEAD
          if out=$(python3 scripts/check_release_readiness.py --root "$wt" 2>&1); then
            st=success
            desc="发版条件满足：PR #${pr} 的 head 上全部版本位一致、判据全过"
          else
            st=failure
            desc="有手工同步位未补齐：合下去会让 main 立刻变红（详见本作业日志）"
          fi
          echo "$out"
          {
            echo "## 发布条件检查（release PR #${pr}，head ${sha:0:8}）"
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          git worktree remove --force "$wt" || true
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/$sha" \
            -f state="$st" \
            -f context="release-gate" \
            -f description="$desc" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          echo "已在 ${sha:0:8} 上回写 release-gate=${st}"
          # 这里刻意不 exit 1：结论已经以 commit status 的形式打在 release PR 上；要真拦合并，
          # 就把分支保护里的必需检查加上 `release-gate`（一键，属于 owner 的决定）。
          # 让本作业失败只会把"有一条 release PR 待发"这件事的红染到每次 main push 的历史上。

  # After release is created, build and upload artifacts
  build-release:
    name: Build Release Artifacts
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check package metadata
        run: twine check dist/*

      # P1 安全修复：生成发布物 SHA256 校验文件
      - name: Generate SHA256SUMS for release artifacts
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # P1 安全修复：生成关键脚本 SHA256 校验文件
      - name: Generate SHA256SUMS for scripts
        run: |
          sha256sum start.bat app/start_app.bat app/clean_launch.py > SHA256SUMS.scripts
          cat SHA256SUMS.scripts

      # P1 安全修复：GPG 签名校验文件（如配置了签名密钥）
      - name: GPG sign SHA256SUMS
        if: env.GPG_SIGNING_KEY != ''
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_SIGNING_KEY" | gpg --import --batch --passphrase "$GPG_PASSPHRASE"
          gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --detach-sign --armor dist/SHA256SUMS
          gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --detach-sign --armor SHA256SUMS.scripts
          echo "GPG 签名完成"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            SHA256SUMS.scripts
            SHA256SUMS.scripts.sig
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          generate_release_notes: true
          body: |
            ## 🔐 完整性验证

            下载发布物后，请验证 SHA256 校验和：

            ```bash
            # Linux/macOS
            sha256sum -c SHA256SUMS

            # Windows PowerShell
            Get-FileHash -Algorithm SHA256 dist/*.whl
            #对比 SHA256SUMS 文件中的值
            ```

            如已导入官方 GPG 公钥，可验证签名：
            ```bash
            gpg --verify SHA256SUMS.sig SHA256SUMS
            ```

            ---
