name: Security Scan

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]
  schedule:
    # Run weekly on Sunday at 01:00 UTC
    - cron: '0 1 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: Dependency Vulnerability Scan (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Scan dependencies for known vulnerabilities
        run: |
          # 已接受风险：transformers 4.52.x 被引擎元数据钉死（4.57.6 实测让 IndexTTS
          # 2.0/2.5 的 infer_v2 / infer_v2_5 导入失败），这几条公告的可达性逐条判定见
          # docs/SECURITY_DEPENDABOT_TRIAGE.md §1，镜像侧同源豁免见 .trivyignore.yaml。
          # 只豁免这 5 个号；**任何新出现的公告仍会让本步变红**。
          # 号取自 run 35561594150 job 106215347173 的实际输出（transformers 4.52.4）。
          pip-audit -r requirements.txt --desc \
            --ignore-vuln PYSEC-2025-216 \
            --ignore-vuln PYSEC-2026-198 \
            --ignore-vuln PYSEC-2026-228 \
            --ignore-vuln PYSEC-2026-229 \
            --ignore-vuln PYSEC-2026-392
          # 2026-08-16 本地评估 0 已知漏洞，解锁为门禁；依赖升级由 dependabot 自动跟进

  bandit:
    name: Code Security Scan (bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit security scan
        run: |
          bandit -r app/integrated_app/ -f json -o bandit-report.json -lll
          bandit -r app/integrated_app/ -f txt -lll

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

  # 密钥泄露扫描 — 学习 Image_MultiModel 的 Trivy FS 模式
  # 扫描仓库历史中的密钥/Token 泄露，防止凭据意外提交。
  secret-scan:
    name: Secret Scanning (Trivy FS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy secret scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0 (SHA pin 防 tag 强更)
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          scanners: 'secret'
          scan-ref: '.'
