name: Security Scan

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Sunday at 01:23 UTC
    - cron: '23 1 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: Dependency Vulnerability Scan (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Scan dependencies for known vulnerabilities
        run: |
          # 已接受风险（2026-10-29 复审后仅剩 2 条）：protobuf 3.19.6 被 descript-audiotools
          # ==0.7.2（indextts 引擎依赖）钉在 <3.20，3.x 无官方修复分支，判据与可达性分析见
          # docs/SECURITY_DEPENDABOT_TRIAGE.md §1 A19/A20。原先 20 条豁免中的 18 条（transformers
          # A1–A17 + accelerate A18）已随 AI 栈整组迁移 5.20.2 / accelerate 1.15.0 被版本真实
          # 消解——OSV 对 transformers@5.20.2 与 accelerate@1.15.0 均返回 0 公告，复审证据见
          # 同一文档 §1c；镜像侧同源豁免见 .trivyignore.yaml（同样只剩 protobuf 2 条）。
          #
          # 两条约束，别绕过：
          #   1. 只豁免这 2 个号；**任何新出现的公告仍会让本步变红**；
          #   2. 号必须绑定证据：取自 §1c 的 OSV 实测（protobuf@3.19.6 → 4 条记录 = 2 个去重
          #      公告 PYSEC-2026-1805/1806）。上一代豁免曾发生过 4 个把长号截断出来的假号
          #      （pip-audit 按全号精确匹配），所以现在由 D4 守卫做"工作流集合 == 分诊文档
          #      在册集合"的双向相等断言，残缺号会被当场抓住。
          #   3. pip-audit 没有 expiration 机制，到期复审靠人：本批豁免复审截止 2026-12-31
          #      （载体是 issue #158，A19/A20 口径），audiotools 放开 protobuf 上界即整批注销。
          pip-audit -r requirements.txt --desc \
            --ignore-vuln PYSEC-2026-1805 \
            --ignore-vuln PYSEC-2026-1806
          # 2026-08-16 本地评估 0 已知漏洞，解锁为门禁；依赖升级由 dependabot 自动跟进

  bandit:
    name: Code Security Scan (bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit security scan
        run: |
          bandit -r app/integrated_app/ -f json -o bandit-report.json -lll
          bandit -r app/integrated_app/ -f txt -lll

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

  # 密钥泄露扫描 — 学习 Image_MultiModel 的 Trivy FS 模式
  # 扫描仓库历史中的密钥/Token 泄露，防止凭据意外提交。
  secret-scan:
    name: Secret Scanning (Trivy FS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy secret scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0 (SHA pin 防 tag 强更)
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          scanners: 'secret'
          scan-ref: '.'
