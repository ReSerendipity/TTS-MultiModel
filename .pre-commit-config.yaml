# Pre-commit hooks for TTS MultiModel
# Install: pip install pre-commit && pre-commit install
# Run: pre-commit run --all-files

repos:
  # Ruff linter + formatter
  # rev 必须与开发者 venv 及 CI（ci.yml 用 `pip install ruff` 取最新版）实际使用的版本一致：
  # 旧 pin v0.12.0 仍带 UP038（isinstance 元组 -> X|Y），而 ruff 0.16.x 已废弃该规则，
  # 结果是本地 `ruff check` 全绿、pre-commit 却凭空报错，且两边会互相改写代码。
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(app/integrated_app|scripts|tests)/
        exclude: ^app/integrated_app/vendor/
      - id: ruff-format
        files: ^(app/integrated_app|scripts|tests)/
        exclude: ^app/integrated_app/vendor/

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
        exclude: \.md$
      - id: check-yaml
        # --multi：允许一个文件含多个 YAML 文档（deploy/kubernetes/*.yaml 是
        # k8s 多资源清单，用 --- 分隔 Deployment/Service/ConfigMap，属合法写法）
        args: [--multi]
        files: \.(yaml|yml)$
        exclude: ^\.github/workflows/
      - id: check-json
        files: \.json$
        exclude: ^locales/
      - id: check-toml
        files: ^pyproject\.toml$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: ^model/|^models/|^\.ruff_cache/
      - id: detect-private-key
        # .github/SECURITY.md 是漏洞披露文档，正文含 "PRIVATE KEY" 字样（报告指引），
        # 非真实密钥文件，排除避免误报；其他文件仍全量扫描。
        exclude: ^\.github/SECURITY\.md$
      - id: check-ast
        files: \.py$
        exclude: ^tests/training/

  # 不单独挂 isort：import 排序的唯一权威是 ruff 的 I 规则
  # （pyproject [tool.ruff.lint] select 含 "I" + [tool.ruff.lint.isort] known-first-party），
  # 再挂一个 isort --profile black 会用 line_length=88 与 ruff 的 120 互相重排，
  # 形成「isort 改完 ruff 再改回来」的死循环，每次提交都被两个钩子来回挡。

  # Shell scripts
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # -S error：只拦截严重度 error 及以上。SC1091（source activate 未指定输入）
        # 属 info 级提示，在容器/CI 环境无法解析 venv 激活脚本，属于环境性噪音而非缺陷。
        args: ["-S", "error"]
        files: \.sh$

  # Engine compatibility check (local hook)
  - repo: local
    hooks:
      - id: check-engine-compat
        name: Engine Compatibility Check
        entry: python scripts/check_engine_compat.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
      # P1 安全修复：禁止提交包含 PRIVATE KEY 标记的 .env 或其他文件
      - id: forbid-private-key-in-env
        name: Forbid PRIVATE KEY in .env files
        entry: python -c "import sys; [sys.exit(1) for f in sys.argv[1:] if any(b'PRIVATE KEY' in open(f,'rb').read()[:4096] for _ in [0])]"
        language: system
        files: \.env$
        pass_filenames: true
      # P1-2 后端设计评估：引擎规格三向一致性（config ↔ registry ↔ 磁盘权重路径）
      - id: check-engine-specs
        name: Engine Specs Consistency Check
        entry: python scripts/check_engine_specs.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
      # P2-6 后端设计评估：训练隔离 AST 门禁（服务路径禁止 import training）
      - id: check-training-isolation
        name: Training Isolation AST Gate
        entry: python scripts/check_training_isolation.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
      # 综合评估主线：能力声明→验证（训练产物/SLO 基线/版本/覆盖缓冲，WARN 不阻断）
      - id: check-declared-capabilities
        name: Declared Capabilities Consistency Check
        entry: python scripts/check_declared_capabilities.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
      # P1-2 测试体系改进：OpenAPI 契约快照测试（防止路由/响应结构非预期变更）
      # 仅在路由/应用入口/引擎接口相关文件变更时触发，避免每次提交都跑全量测试。
      - id: openapi-contract-snapshot
        name: OpenAPI Contract Snapshot Test
        entry: python -m pytest tests/test_openapi_snapshot.py -q --tb=short
        language: system
        pass_filenames: false
        files: ^(app/integrated_app/(routes|app_server|engine_interface)|tests/test_openapi_snapshot|tests/snapshots/openapi_contract)/
        stages: [pre-commit, pre-push]

# Configuration
default_language_version:
  python: python3.12

ci:
  autofix_commit_msg: "[pre-commit] auto-fix: trailing whitespace, EOL, etc."
  autofix_prs: true
  autoupdate_branch: dev
  autoupdate_commit_msg: "[pre-commit] auto-update hooks"
  autoupdate_schedule: weekly
  skip: [shellcheck]  # Windows CI doesn't have shellcheck
  submodules: false
