# Trivy 忽略清单 —— 只用于"已接受风险"的镜像漏洞豁免。
#
# 为什么存在：本产品的运行环境被引擎真实约束钉在 transformers 4.52.x
# （IndexTTS 2.0/2.5 的发行元数据要求 transformers==4.52.1；实测 4.57.6 下
# indextts.infer_v2 / infer_v2_5 直接 ImportError，见 docs/SECURITY_DEPENDABOT_TRIAGE.md §2）。
#
# 为什么这里只有 3 条、而 pip-audit 那边有 16 条（不是漏了）：
# 两个门禁的过滤口径不同。镜像扫描这两步带 `severity: CRITICAL,HIGH` +
# `ignore-unfixed: true`（docker-build.yml:65 / docker-publish.yml:99），于是 4.52.4 的
# 16 个公告里只有"HIGH 且有修复版本"的 3 条会进结果 —— 就是下面这 3 条，CI 实测
# `Total: 6 (HIGH: 6, CRITICAL: 0)`（同一镜像里 root 与 ttsuser 两处 site-packages 各算一次）。
# 其余 13 条（8 条无修复版本的本地向量 + 5 条 MODERATE）由 pip-audit 那一步逐条豁免，
# 因为 pip-audit 没有 severity / unfixed 过滤器。两边的 id 集合都在分诊文档 §1 的同一张表里。
#
# 规则（三条都要满足，tests/test_dependency_consistency.py 的 D3/D4 会核对）：
#   1. 只允许登记分诊文档 §1 表里已有的 id，且逐条写"为什么本仓不可达"（写在条目上方注释）；
#   2. 每条必须给 expiration —— 到期该条自动失效、门禁重新变红，逼一次复审；
#   3. 必须绑定 package.version。这里绑 4.52.4 是**镜像实际装的版本**（Dockerfile:33/38 装
#      requirements.txt 的声明并解析到 4.52.4，而不是锁里的 4.52.1 —— 这两条分发路径解析
#      不同版本，已作为已知缺口记在分诊文档 §3b）。绑死版本号的好处是：哪天镜像里换成别的
#      transformers 版本，这些豁免自动不生效、门禁变红，而不是悄悄继续放行。
#
# 输入名注意：trivy-action v0.36.0 的合法输入叫 `trivyignores`，**没有** `ignorefile`
# （写错只出一条 "Unexpected input(s) 'ignorefile'" 警告然后照常变红，等于没豁免 —— 本轮踩过）。
vulnerabilities:
  # CVE-2026-4372（PYSEC-2026-2289 / GHSA-29pf-2h5f-8g72，HIGH，CVSS 3.0 AV:L，修复于 5.3.0）：
  # transformers 远程代码执行，触发前提是加载攻击者可控的仓库代码
  # （trust_remote_code 或远程 model 指向）。本仓权重全部来自 model/ 本地目录，
  # 经人工确认 + SHA-256 复验后才入库（LOCAL_RULES 禁区流程）；镜像内无远程模型入口。
  - id: CVE-2026-4372
    package:
      name: transformers
      version: "4.52.4"
    expiration: "2026-12-31T00:00:00Z"

  # CVE-2026-5241（PYSEC-2026-2290 / GHSA-fgcw-684q-jj6r，HIGH，CVSS 3.1 AV:N，修复于 5.5.0）：
  # 模型初始化期的任意代码执行，载体是 LightGlue 一类视觉匹配模型。
  # 本仓只加载 TTS 语音模型（voxcpm / indextts / funasr / zipenhancer），无该代码路径。
  - id: CVE-2026-5241
    package:
      name: transformers
      version: "4.52.4"
    expiration: "2026-12-31T00:00:00Z"

  # CVE-2026-9856（PYSEC-2026-3929 / GHSA-xrqw-3rrv-vx5w，HIGH，CVSS 3.0 AV:N，修复于 5.10.0）：
  # save_pretrained 经 chat template 造成任意文件写。
  # 全仓无 save_pretrained 调用（grep 证据见分诊文档 §1 A8），音色保存走我们自己的目录写入。
  - id: CVE-2026-9856
    package:
      name: transformers
      version: "4.52.4"
    expiration: "2026-12-31T00:00:00Z"
