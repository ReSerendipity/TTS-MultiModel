# Trivy 忽略清单 —— 只用于"已接受风险"的镜像漏洞豁免。
#
# 现状（2026-10-29 复审后）：血统已整组迁到 transformers 5.20.2（PR #238），OSV 对
# transformers@5.20.2 与 accelerate@1.15.0 返回 0 公告 → 原先的 transformers 系豁免
# （3 条 CVE 绑 4.52.4）全部注销，证据与联动变更见 docs/SECURITY_DEPENDABOT_TRIAGE.md §1c。
# 本清单唯一幸存的暴露面是 **protobuf 3.19.6**：descript-audiotools==0.7.2（indextts 引擎
# 依赖）强制 protobuf<3.20，锁与镜像都解析到 3.19.6；3.x 无官方修复分支（修复线在
# 4.25.8 / 5.29.x），audiotools 放开上界前只能逐条豁免。
#
# 规则（三条都要满足，tests/test_dependency_consistency.py 的 D3/D4 会核对）：
#   1. 只允许登记分诊文档 §1 表里已有的 id，且逐条写"为什么本仓不可达"（写在条目上方注释）；
#   2. 每条必须给 expiration —— 到期该条自动失效、门禁重新变红，逼一次复审；
#   3. 必须绑定 package.version。绑 3.19.6 是**镜像实际装的版本**（Dockerfile 按
#      requirements.txt 声明解析）；哪天 audiotools 放开上界、镜像里 protobuf 换版，
#      这些豁免自动不生效、门禁变红，而不是悄悄继续放行。
#
# 输入名注意：trivy-action v0.36.0 的合法输入叫 `trivyignores`，**没有** `ignorefile`
# （写错只出一条 "Unexpected input(s) 'ignorefile'" 警告然后照常变红，等于没豁免 —— 踩过，
# 由 D4 守卫钉住）。
vulnerabilities:
  # CVE-2025-4565（PYSEC-2026-1806 / GHSA-8qvm-5x2c-j2w7，HIGH，修复于 4.25.8/5.29.5/6.31.1）：
  # protobuf 纯 Python 后端非可信数据递归 DoS。2.9.0 起 descript-audiotools==0.7.2（indextts
  # 引擎依赖）强制 protobuf<3.20，镜像解析到 3.19.6。可达性：app/ 对 google.protobuf 零命中，
  # protobuf 仅被 tensorboardX 生成物消费（训练实验链、本机自产 event 文件），无不可信 wire
  # 输入面。分诊依据 §1 A19（已接受风险 + 复点）。
  - id: CVE-2025-4565
    package:
      name: protobuf
      version: "3.19.6"
    expiration: "2026-12-31T00:00:00Z"

  # CVE-2026-0994（PYSEC-2026-1805 / GHSA-7gcm-g887-7qv7，HIGH，修复于 5.29.6/6.33.5）：
  # protobuf JSON 递归深度绕过。可达性与分诊依据同 A19/上一条（§1 A20）。
  - id: CVE-2026-0994
    package:
      name: protobuf
      version: "3.19.6"
    expiration: "2026-12-31T00:00:00Z"
