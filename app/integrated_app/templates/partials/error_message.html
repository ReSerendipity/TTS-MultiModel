{# role=alert：这块是 htmx 直接 innerHTML 换进页面的，没有活区声明的话读屏软件不会播报任何失败信息 #}
<div class="tts-error-block" role="alert" data-error-type="{{ error_type|default('general') }}">
  <div class="error-title">{{ (title_key or 'gen_failed')|t(lang|default('zh-CN')) }}</div>
  <div class="error-message">{{ error_message }}</div>
  <div class="tts-error-actions">
    {% if error_type == 'engine_not_ready' and engine_id %}
    <button type="button" class="tts-btn tts-btn-load-now" data-switch-model="{{ engine_id|e }}" style="background:var(--p500);color:#fff;border:none;padding:5px 14px;border-radius:6px;cursor:pointer;font-size:12px;margin-right:6px">
      {{ "load_now"|t(lang|default('zh-CN')) }}
    </button>
    {% endif %}
    <button type="button" class="tts-btn tts-btn-retry" onclick="window.ttsRetryGeneration(this)">
      {{ "retry"|t(lang|default('zh-CN')) }}
    </button>
  </div>
</div>
