version: "2.2.1"

server:
  host: "127.0.0.1"
  port: 7869
  auto_load_model: false
  # SSL configuration - disabled by default (aligned with Image_MultiModel):
  # HTTPS only activates when ssl.enabled=true AND certfile/keyfile exist on disk.
  # To enable HTTPS, set enabled: true (certs are already trusted for 127.0.0.1).
  ssl:
    enabled: false
    certfile: "app/cert.pem"
    keyfile: "app/key.pem"

models:
  # P1-3: 模型路径模式（来源：Image_MultiModel）
  # - portable（默认）：使用项目内 model/ 目录，自包含
  # - shared：使用 shared_models_root 指定的外部共享目录，
  #   可与 Seedvr2 / Image_MultiModel 共享模型文件，节省磁盘
  # 注意：shared 模式下路径结构须与 portable 一致：
  #   {shared_root}/VoxCPM2/, {shared_root}/SenseVoiceSmall/, {shared_root}/IndexTTS-2.5/, {shared_root}/IndexTTS-2.0/ 等
  model_source_mode: portable
  vram_safety_margin_gb: 1.5  # VRAM 安全余量倍数：加载预检所需显存 = 引擎基线需求 × 该倍数
  shared_models_root: ""   # 例如：C:/AI_Shared_Models
  voxcpm2:
    model_path: "model/VoxCPM2"
    asr_path: "model/SenseVoiceSmall"
    denoiser_path: "model/speech_zipenhancer"
  # 声明式引擎注册表（对齐 VoiceBox ModelConfig 设计）
  # 新引擎只需在此声明即可自动注册、显存预检和 UI 渲染
  engines:
    voxcpm2:
      name: "voxcpm2"
      display_name: "VoxCPM2"
      model_dir: "VoxCPM2"
      vram_gb: 6.5
      ram_gb: 16.0
      languages: ["zh", "en", "ja", "ko", "ar", "de", "es", "fr", "hi", "it", "nl", "pl", "pt", "ru", "sv", "tr", "vi", "bn", "fa", "sw", "tl", "ur", "my", "ta", "th", "cs", "el", "hu", "ro", "uk"]
      quality: "high"
      license: "Apache-2.0"
      supported_features: ["voice_design", "clone", "ultimate", "script", "streaming", "prompt", "lora"]
      sample_rate: 48000
      requires_gpu: true
    indextts2:
      name: "indextts2"
      display_name: "IndexTTS 2.5"
      model_dir: "IndexTTS-2.5"
      vram_gb: 6.0
      ram_gb: 16.0
      languages: ["zh", "en", "ja", "es", "ar"]
      quality: "high"
      license: "bilibili Model Use License（商用需向 bilibili 登记书面授权）"
      supported_features: ["clone", "emotion_control", "duration_control"]
      sample_rate: 22050
      requires_gpu: true
    indextts20:
      name: "indextts20"
      display_name: "IndexTTS 2.0"
      model_dir: "IndexTTS-2.0"
      vram_gb: 5.5
      ram_gb: 16.0
      languages: ["zh", "en"]
      quality: "high"
      license: "bilibili Model Use License（商用需向 bilibili 登记书面授权）"
      supported_features: ["clone", "emotion_control"]
      sample_rate: 22050
      requires_gpu: true
    voicebox:
      name: "voicebox"
      display_name: "Voicebox VC"
      model_dir: "OpenVoice"
      vram_gb: 4.0
      ram_gb: 8.0
      languages: ["zh", "en", "ja", "ko", "es", "fr", "de"]
      quality: "high"
      license: "MIT"
      supported_features: ["voice_conversion", "zero_shot_clone"]
      sample_rate: 22050
      requires_gpu: false
      # Voicebox 专用配置（基于 OpenVoice ToneColorConverter）
      base_se_path: "model/OpenVoice/base_se.pth"  # base speaker 嵌入，可选
      default_tau: 0.3  # 默认音色转换强度 0.0-1.0
ui:
  theme: dark
  language: zh-CN
  show_onboarding: true
history:
  # 历史记录数据库路径（相对项目根目录）。此前该值为死配置（代码硬编码 data/history.db），
  # 现由 app/integrated_app/config.py::get_history_db_path() 实际消费，作为路径的单一事实来源。
  # 优先级：环境变量 TTS_HISTORY_DB_PATH > 本配置 > data/history.db
  db_path: data/history.db
  # 历史记录保留天数（已废弃，向后兼容别名）。
  # 数据治理评估（v2.2.1）修正：留存策略已统一到 security.pii_retention_days（删 DB+音频）。
  # 本字段仅在 pii_retention_days <= 0 时作为回退；0=永久保留。
  # 实现见 config.py::get_effective_retention_days()，由 get_history_db() 单例创建时调用一次。
  keep_days: 0

# ── 生成版本谱系（数据治理评估 P2-9：实验性功能，默认未接入生成流程） ──
# generation_versioning.py 模块完整实现了版本谱系 CRUD，但 service_layer.save_generation_version
# 从未被调用，路由层无 API 端点，outputs/generation_versions.db 中 95 行均为测试数据(/tmp/a.wav)。
# 治理决策：保留模块代码供未来启用，默认关闭；已清理测试数据。
generation_versioning:
  enabled: false
  db_path: outputs/generation_versions.db

logging:
  level: INFO
  file_size_mb: 10
  file_count: 3
  format: "[%(asctime)s] [%(levelname)s] [PID:%(process)d TID:%(thread)d] [%(name)s:%(filename)s:%(lineno)d] [req=%(request_id)s] %(message)s"


# P1-2: 断点续跑任务队列运行时配置（对应 config_models.RuntimeTaskConfig）
runtime:
  task:
    checkpoint_dir: "data/checkpoints"
    checkpoint_every: 5
    auto_recover: false
  integrity:
    block_startup_on_failure: false
    verify_binaries: false
    expected_model_hashes: "configs/model_integrity_manifest.json"  # P2-3：模型权重 SHA256 清单路径；清单不存在时不校验，运行 scripts/generate_model_integrity_manifest.py 生成
    block_on_model_mismatch: false

watermark:
  enabled_in_code: true
  method: dct_frequency
  product_id: TTSMULTI-1
  embed_timestamp: true
  embed_task_id: true
  strength: 0.062                  # P3：水印嵌入强度（已接线，原硬编码 0.062；范围 0.001-0.062）
  failure_mode: provenance         # 桌面分发与安全加固 P0：嵌入失败策略（重试 1 次后）
                                   #   provenance（默认）：写 <输出>.provenance.json 侧车 + 返回原音频（fail-open 但留痕）
                                   #   block：抛 WatermarkEmbedError 阻断产出（fail-closed）
                                   # 密钥注入：默认每机首启自动生成 data/.watermark_key；
                                   #   企业统一密钥可用环境变量 TTS_WATERMARK_KEY（64 hex）注入（空间隔离）
  retry: 1                         # 桌面分发与安全加固 P0：嵌入失败重试次数（固定 1 次，代码常量，此处仅文档化）

# ── API 速率限制（M2 整改：覆盖 /v1 与上传端点 + 可信代理 XFF） ──
rate_limit:
  enabled: true
  requests_per_minute: 10
  burst: 5
  trusted_proxies: []
  clone_max_per_hour: 20                # P0：每 IP 每小时最大克隆操作次数（0 关闭克隆专用限流）

# ── 安全 / PII / 内容安全 / 审计（H3 / M3 / M7 整改） ──
security:
  content_safety_enabled: true          # M3：生成前文本安全检测网关
  pii_encryption_enabled: true          # P1：历史记录 PII 列级加密默认开启（存量明文行可运行 scripts/migrate_pii_encryption.py 迁移）
                                         # 加密范围：仅 generation_history.text_preview（用户输入文本，enc: 前缀 Fernet）。
                                         # 声纹数据（personas/*.pt 声纹特征、outputs/uploads/ 参考音频）不在列级加密范围，
                                         #   受 upload_ttl_days 生命周期管理 + 文件系统权限保护；如需加密需单独设计。
                                         # 密钥轮换：python scripts/rotate_pii_key.py --dry-run（验证后去掉 --dry-run）。
  pii_retention_days: 90                # H3：PII 留存期限（天），0 表示永久保留；统一留存口径（见 config.py get_effective_retention_days）
  audit_enabled: true                   # P1：结构化审计日志默认开启（JSONL 10MB 轮转，detail 不含 PII 文本）
  upload_ttl_days: 30                   # P1：上传参考音频（outputs/uploads/）留存天数，超期自动清理；0=不清理
  ai_audio_prefix_enabled: false         # P1-4b：生成音频开头叠加可选 AI 标识提示音（默认关闭）
  ai_audio_prefix_ms: 200                 # P1-4b：AI 标识提示音时长（毫秒，50-2000）
  training_data_ttl_days: 90              # P2-2：训练会话临时数据留存天数；0=不清理
  reference_audio_min_seconds: 3.0      # P0：上传参考音频最小时长（秒），0 关闭；同时拒绝近静音
  # 桌面分发与安全加固 P0：启动完整性自检强制模式
  # - enforce: true 时清单验签/哈希失败 → 抛 RuntimeError 拒绝启动（fail-fast）
  # - 需与密钥分发配套：CI Secret 注入 Ed25519 私钥（MANIFEST_SIGNING_KEY_B64）+
  #   公钥入包（security/manifest_signing_public_key.pem）+ data/ 下 0600 密钥文件
  # - 开发机：无私钥时回退 HMAC（data/.integrity_hmac_secret，本机签名后验签）
  integrity_selfcheck:
    enforce: true
  # P2-11：outputs/ 目录生命周期策略
  # - 生成音频(outputs/*.wav)：与 history.db 记录绑定，随 pii_retention_days 统一清理（删 DB+音频）
  # - 上传参考音频(outputs/uploads/)：受 upload_ttl_days 管理，超期自动清理
  # - 非音频文件(数据库/迁移备份/临时文件)：不应出现在 outputs/，使用 scripts/clean_outputs.py 治理
  # - 孤儿音频(有文件无 DB 记录)：scripts/clean_outputs.py --delete 可清理

# ── 生成流程参数（配置外置：超时 / 并发 / 信号量排队） ──
generation:
  timeout_s: 600                        # 单次生成硬超时（秒），超时返回 503
  max_concurrent: 1                     # 每引擎最大并发生成数
  semaphore_acquire_timeout_s: 120      # 获取生成信号量排队等待上限（秒），超时返回 429
  # 运维稳定性评估 P1-4：OOM 后受控自动重载（无 on-call 场景的自愈路径）
  oom_auto_reload: true                 # OOM 重试耗尽后后台自动重载当前引擎；失败标记不健康交由容器重启
  oom_auto_reload_cooldown_s: 300       # 两次自动重载最小间隔（秒），防损坏状态下重载风暴
  # 生成结果缓存（BACKEND_DESIGN_ASSESSMENT 长期项）：相同请求短 TTL 命中，降低重复 GPU 推理成本。
  # 默认关闭（零风险）；开启后命中时复用既有音频文件、跳过推理，但仍计入历史与监控统计。
  cache_enabled: false
  cache_ttl_seconds: 300                # 缓存条目基础生存时间（秒），实际过期叠加随机抖动防雪崩

# ── 可观测性（SRE 评估 P0~P2 落地） ──
# 全部可选：缺省时各消费模块使用内置默认值，离线可运行；外部 exporter / webhook 仅作增强。
# 无需任何外部服务即可生效（硬约束 #5 离线优先）。
observability:
  # SLO / SLI 目标（P1-1）：可用性 / 生成成功率 / 平均生成耗时上限
  slo:
    availability: 99.5            # 目标可用性 %
    min_success_rate: 99.0        # 目标生成成功率 %
    max_avg_latency_ms: 30000.0   # 目标平均生成耗时上限 ms
    max_p95_latency_ms: 90000.0   # 目标 p95 尾部延迟上限 ms（运维实施 P1；须按设备/文本长度分布校准，样本<10 按达标）
  # 告警规则阈值（P0-2）：指标越过阈值即触发对应告警通道
  alerting:
    enabled: true
    min_success_rate: 95.0        # 成功率低于此值触发 CRITICAL（样本 >=10 时）
    vram_usage_warn_pct: 85.0     # 显存占用 >= 此值触发 WARNING（接近 90% 熔断线）
    webhook_url: ""               # 可选：企业微信/飞书/Slack 兼容 incoming webhook（留空仅写日志）
  # 容量采样后台任务（P2-3）：固定频率采集 GPU/CPU/内存时序
  capacity_sampling:
    enabled: true
    interval_seconds: 30
  # 指标 / 日志（P2-8 / 12-Factor XI）：TTS_LOG_FORMAT=json 时输出 JSON 结构化日志便于集中采集
  logging:
    text_format: "[%(asctime)s] [%(levelname)s] [PID:%(process)d TID:%(thread)d] [%(name)s:%(filename)s:%(lineno)d] [req=%(request_id)s] %(message)s"
    json_format: true             # 仅作声明，真实开关走环境变量 TTS_LOG_FORMAT=json
