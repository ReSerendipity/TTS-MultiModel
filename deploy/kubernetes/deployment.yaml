# TTS_MultiModel —— Kubernetes Deployment / Service / 探针 / GPU 资源
# 设计要点（对齐容器化评估 P2-9 与 SRE 评估 §1.4）：
#   - 单副本 StatefulSet 语义（有状态：依赖本地 GPU 与挂载存储），此处以 Deployment 简化呈现；
#     若需多副本推理，需先解决「单 Worker 串行」硬约束与多卡调度（见 SRE §1.4）。
#   - 探针：liveness/startup 复用 /api/health/ping（进程活性），readiness 接 /readyz
#     （引擎真实就绪闸门，未加载时返回 503，防止未就绪 Pod 接流量）。
#   - securityContext：非 root、只读根文件系统、丢弃全部 capabilities（与 docker-compose 对齐）。
#   - GPU 通过 nvidia.com/gpu 资源请求独占（单卡 SPOF，与单机一致）。
#   - 优雅停机：terminationGracePeriodSeconds 与 uvicorn timeout_graceful_shutdown=60 对齐。
#   - P0-1 修复（云原生评估 2026-09-05）：readOnlyRootFilesystem=true 下，27G 权重卷
#     /app/model 与运行时可写目录 /app/{data,outputs,logs,cache,lora} 必须显式挂载，
#     否则 Pod 因找不到权重 / EROFS 写入失败陷入重启循环（与 docker-compose.yml 挂载面对齐）。
#     subPath 所指 PVC 子目录由 initContainer 预建（subPath 目录缺失会导致挂载失败）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tts-multimodel
  namespace: tts
  labels:
    app: tts-multimodel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tts-multimodel
  template:
    metadata:
      labels:
        app: tts-multimodel
    spec:
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        # P0-1：subPath 挂载要求 PVC 内子目录预先存在（kubelet 不会自动创建）。
        # 用主镜像（离线可用、自带 python）在可写的 data 卷上预建全部运行时目录。
        - name: init-dirs
          image: ghcr.io/reserendipity/tts-multimodel:2.2.1
          imagePullPolicy: IfNotPresent
          command: ["python3.12", "-c",
            "import os; [os.makedirs(f'/mnt/data/{d}', exist_ok=True) for d in ['data','outputs','logs','cache','lora','personas']]; print('init-dirs ok')"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /mnt/data
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      containers:
        - name: tts
          image: ghcr.io/reserendipity/tts-multimodel:2.2.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7869
              name: http
          env:
            - name: TTS_BIND_HOST
              value: "0.0.0.0"
            - name: TTS_BIND_PORT
              value: "7869"
            - name: TTS_API_AUTH_ENABLED
              value: "1"
            - name: TTS_API_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tts-auth
                  key: api_token
            - name: TTS_LOG_FORMAT
              value: "json"
            - name: TTS_CONFIG_PATH
              value: "/app/config.yaml"
            - name: TTS_HISTORY_DB_PATH
              value: "/data/history.db"
            - name: TTS_GRACEFUL_SHUTDOWN_S
              value: "60"
          envFrom:
            - configMapRef:
                name: tts-config
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            # P0-1：27G 权重（独立 PVC，只读——推理不写权重目录）
            - name: model
              mountPath: /app/model
              readOnly: true
            # P0-1：运行时可写目录（与 docker-compose.yml 挂载面对齐，同一 tts-data PVC 分子目录）
            - name: data
              mountPath: /app/data
              subPath: data
            - name: data
              mountPath: /app/outputs
              subPath: outputs
            - name: data
              mountPath: /app/logs
              subPath: logs
            - name: data
              mountPath: /app/cache
              subPath: cache
            - name: data
              mountPath: /app/lora
              subPath: lora
            # 音色库：只读（与 compose 的 ./personas:/app/personas:ro 一致）
            - name: data
              mountPath: /app/personas
              subPath: personas
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            limits:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: 1
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: 1
          readinessProbe:
            # P0 修复（运维稳定性评估 2026-09-05）：原指向 /api/system/health/ready，
            # 该端点在 degraded（模型未加载）时仍返回 200，导致未就绪 Pod 被 Service
            # 选中、流量打进来全 5xx。改接 /readyz——引擎未就绪时真实返回 503。
            httpGet:
              path: /readyz
              port: 7869
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health/ping
              port: 7869
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /api/health/ping
              port: 7869
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 18
      volumes:
        - name: config
          configMap:
            name: tts-config
        # P0-1：模型权重独立卷（由管理员以 rsync/object store 预填充，见 README）
        - name: model
          persistentVolumeClaim:
            claimName: tts-models
        - name: data
          persistentVolumeClaim:
            claimName: tts-data
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tts-multimodel
  namespace: tts
  labels:
    app: tts-multimodel
spec:
  selector:
    app: tts-multimodel
  ports:
    - name: http
      port: 7869
      targetPort: 7869
  type: ClusterIP
