# TTS_MultiModel —— API Auth Secret 样例（P1-2：部署前必读）
# ⚠ 这是模板，不要把真实 token 提交进仓库！推荐用 kubectl 命令行生成（不落盘）：
#
#   kubectl -n tts create secret generic tts-auth \
#     --from-literal=api_token="$(python3 -c 'import secrets;print(secrets.token_hex(16))')"
#
# 若坚持使用本文件：把 <REPLACE...> 换成强随机 token 后 apply，
# 并确保该文件不出现在任何提交中（已在 .gitignore 建议排除 secret.local.yaml）。
apiVersion: v1
kind: Secret
metadata:
  name: tts-auth
  namespace: tts
  labels:
    app: tts-multimodel
type: Opaque
stringData:
  # deployment.yaml 的 TTS_API_AUTH_TOKEN 通过 secretKeyRef 引用此 key
  api_token: "<REPLACE_WITH_RANDOM_TOKEN_kubectl_create_secret_shown_above>"
