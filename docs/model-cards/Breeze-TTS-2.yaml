notes: |
  中英双语高表现力引擎（Artificial Analysis TTS 榜开源权重第一）。
  3.48B：T5Gemma2 文本编码器 + Qwen3 backbone + Qwen3-TTS 12Hz codec，24kHz 输出。
  四大能力：Voice Clone（参考音频+准确转写）、Voice Design（自然语言音色描述，
  CFG=4）、Voice Direction（克隆+指令控制，走 ultimate 协议槽位）、
  Vocal Events（正文内嵌 (laugh)/[笑] 等事件标记）。
  运行约束：eager 注意力 + 全部 fast 阶段关闭（CUDA Graph fast path 仅限
  Linux + 14.4GiB 显存），bf16 峰值显存约 7.5GiB（社区 RTX 5090 实测），
  12GB 卡为最低配置；单次文本上限 2000 字符（2048 token 序列约束）。
  依赖：transformers>=4.57.3（qwen_tts_min 裁剪副本随引擎 vendor，
  不引入 PyPI qwen-tts 及其 gradio/onnxruntime 重依赖）。
