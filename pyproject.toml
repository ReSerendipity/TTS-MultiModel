[project]
name = "tts-multimodel"
version = "2.9.1"
description = "TTS MultiModel - Multi-engine Text-to-Speech platform with voice cloning, voice design, and LoRA fine-tuning"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "ReSerendipity" },
]
keywords = [
    "tts",
    "text-to-speech",
    "speech-synthesis",
    "voice-cloning",
    "voice-design",
    "voxcpm2",
    "indextts2",
    "lora",
    "fine-tuning",
    "fastapi",
    "pytorch",
    "deep-learning",
    "audio-generation",
    "speech",
    "chinese-tts",
    "multi-model",
    "script-dubbing",
    "streaming-tts",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
        "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: FastAPI",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: English",
    "Natural Language :: Japanese",
    "Natural Language :: Korean",
]
dependencies = [
    # === 深度学习框架（版本必须匹配：torch 2.5.x -> torchvision 0.20.x -> torchaudio 2.5.x）===
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "torchaudio>=2.5.1",
    # 版本策略：上界是实测钉出来的，不是保守猜测。
    # - 2026-09-21 曾把上界钉在 <4.53：当时 4.57.6 下 `indextts.infer_v2_5`/`infer_v2`
    #   顶层 ImportError（QuantizedCacheConfig 等 4 个符号在 4.53+ 被移除）。
    # - 2026-10-25 为接入 Breeze TTS 2（其模型代码要求 transformers>=4.57）抬到 4.57.3：
    #   indextts 的 4 处断裂由 `engines/indextts_tf_compat.py` shim 在导入前回填修复
    #   （幂等、hasattr 守卫，<=4.52 环境 no-op），.venv 实测两模块导入全通；
    #   Breeze vendored 代码链在 4.57.3 + torch 2.13 下导入全通。
    # - IndexTTS 真机推理回归与三引擎冒烟验收记录见
    #   docs/plans/BREEZE_TTS2_INTEGRATION_GUIDE.md。
    # 安全面：4.52.x 原带 16 个 transformers 公告（A1–A4 需 4.53+），4.57.3 抬升已消解
    # 其中 4 条；其余维持 docs/SECURITY_DEPENDABOT_TRIAGE.md §1 的登记口径。
    # - 2026-10-27 抬到 5.20.2（owner 裁决的 AI 栈整组迁移：dependabot #201/#203/#232
    #   因锁集自洽互斥无法独立合并——transformers 4.x 与 hub 1.x 互斥、4.57 硬顶
    #   tokenizers<=0.23.0，只能整组跳）：同期 hub 0.36.2→1.33.0、tokenizers 0.22.2→0.23.3。
    #   indextts shim（engines/indextts_tf_compat.py）按 4.53+ 断裂面回填，5.x 新增移除
    #   符号的兼容性以 CI pytest 导入测试 + 合并后真机推理冒烟为准，发布前必须完成冒烟。
    # tests/test_dependency_consistency.py 会核对：本声明与 requirements-lock.txt 的钉版互相满足。
    "transformers>=5.20.2,<5.21",
    "tokenizers>=0.23.3,<0.24",
    # === AI 生态 ===
    "funasr>=1.0.0",
    "modelscope>=1.9.0",
    # modelscope 的 pipeline/config 解析在运行期需要 addict；引擎切换路径
    # （_load_voxcpm2_engine 强制 include_denoiser=True）会经 speech_zipenhancer
    # 走到它。缺失时降噪会降级关闭、音质下降，故列为生产依赖而非可选。
    "addict>=2.4.0",
    # vendored VoxCPM 的模型代码在**模块顶层** `from einops import rearrange`
    # （vendor/voxcpm/model/voxcpm.py:29、voxcpm2.py:30、modules/locenc/local_encoder.py:4），
    # 而 funasr / modelscope 只在 extras 里声明 einops（我们装的是无 extras 的核心集）——
    # 于是任何只按 [project].dependencies / requirements.txt 装出来的环境都起不来 tts-1：
    # 2026-09-21 docker-smoke 的镜像内导入探针第一次真跑就报
    # `FAIL integrated_app.vendor.voxcpm ModuleNotFoundError No module named 'einops'`（run 35618578940）。
    # 本机 .venv 从未暴露此事，因为 einops 是从 conformer / vector-quantize-pytorch / indextts
    # 那条**训练链路传递**进来的（`pip show einops` 的 Required-by 实测），不是我们自己声明的。
    # 它是第一方代码的直接依赖，不该靠运气继承 —— 由 tests/test_dependency_consistency.py D5 守住。
    "descript-audiotools==0.7.2",
    "einops>=0.7.0",
    # === Web 框架 ===
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    # === 音频处理 ===
    "soundfile>=0.12.1",
    "pydub>=0.25.1",
    # librosa 被 audio_processing / resampling 与 VoxCPM2 的 prompt / script 模式
    # 在函数内懒导入（此前只作为 funasr 的传递依赖存在）。显式声明，避免上游
    # 依赖树变动后这些运行路径静默 ImportError。
    "librosa>=0.10.0",
    # safetensors 用于 engines/voxcpm2/lora.py 加载 LoRA 权重。
    "safetensors>=0.4.0",
    # === 数值计算 ===
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    # === 工具库 ===
    "pyyaml>=6.0",
    "httpx>=0.24.0",
    "aiofiles>=23.0",
    "cryptography>=41.0.0",
    # psutil 被 routes/system/health.py 与系统维护端点（stats/gpu/队列/内存泄漏检测）
    # 在模块导入期直接 import。此前仅作为传递依赖存在于 requirements-lock.txt，
    # 而 CI 按 requirements.txt 安装，导致 pytest 全矩阵 ImportError（M4/M5 安全批次引入）。
    # 显式声明与 librosa 同理：避免上游依赖树变动后运行路径静默 ImportError。
    "psutil>=5.9.0",
    # === 繁简转换（纯 Python 替代 opencc 源码编译）===
    "opencc-python-reimplemented>=0.1.0",
    # wetext / inflect 被 vendored VoxCPM 的文本正则化在**生成期懒导入**
    # （vendor/voxcpm/utils/text_normalize.py:4-5 顶层 import，无守卫），
    # 服务启动 / 引擎加载都不经过它 —— 2026-10-01 全流程 UI 模拟第一次真实
    # voice_design 生成即报 `No module named 'wetext'`（生成失败，audit 记 failure）。
    # 本机旧 .venv 从未暴露是因为 wetext 只作为环境存量存在，三份依赖清单均无声明；
    # 测试全矩阵 mock 引擎，同样探不到。显式声明（与 einops / librosa 同理由 D5 守住）。
    "wetext>=0.1.8",
    "inflect>=7.0.0",
    # noisereduce：克隆/降噪路径在启用"参考音频降噪"时懒导入（engines/voxcpm2/clone.py:437、
    # audio_processing.py:72），缺失时该 UI 可达路径直接 RuntimeError 而非优雅降级。
    # pynvml：routes/system/gpu.py 的 GPU 统计懒导入（有守卫，缺失仅降级为 "--"），
    # 但 GPU 页是常驻功能，显式声明避免静默劣化。
    "noisereduce>=3.0.0",
    "pynvml>=12.0.0",
    # accelerate 被 indextts.infer_v2_5 在**引擎加载路径**上懒导入（device_map），
    # 缺失即 503 "requires accelerate"（2026-10-01 全流程 UI 模拟实测）。
    # 旧环境因传递依赖侥幸可用，三份清单均无声明；与 einops 同型缺口。
    "accelerate>=1.8.1",
    # descript-audiotools==0.7.2：indextts 推理链硬导入 audiotools（GPT 加载路径）。
    # 2.8.x 时代故意不进本清单——当时 indextts 走用户 pip install -e 安装、依赖随上游
    # 传递；2.9.0 起代码包改由 reference_repos 引导（不再 pip install），其依赖必须
    # 由本清单显式接管。注意其元数据要求 protobuf<3.20（已同步锁文件到 3.19.6；
    # tensorboardX 声明 >=3.20 属元数据冲突，tensorboardX 仅训练链懒导入、运行时不触达，
    # 实测 funasr/modelscope/create_app 全链在 3.19.6 下正常）。
    "fugashi>=1.3.0",
    "unidic-lite>=1.0.8",
    # openai-whisper：indextts.utils.tokenizer 顶层 from whisper.tokenizer import
    # Tokenizer（2026-10-01 runtime 实装时暴露，与上面同批）。
    "openai-whisper>=20231117",
    # === 数据校验 ===
    "pydantic>=2.0",
]

[project.optional-dependencies]
# pre-commit 精确钉住本机门禁实测通过的框架版本（Better Harness 待批 item6.2 锁卫生）：
# 4.7.0 是 .venv 实际在用、且 .pre-commit-config.yaml 各 hook rev 与之联调通过的版本。
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "pytest-cov>=4.0", "ruff>=0.4", "mypy>=1.0", "pre-commit==4.7.0"]
vllm = ["vllm>=0.6.0"]
watermark = []  # No extra deps needed, uses numpy/scipy only
# IndexTTS 情感「文本描述」模式（emo_text）需要 QwenEmotion 子模型（device_map 加载）。
# 2026-10-01 实测修正：accelerate 已不只是 emo_text 的前置——indextts.infer_v2_5 模块
# 顶层即有 device_map 加载路径，引擎**加载本身**就会抛 "requires accelerate"
# （旧注释"未安装时引擎仍可正常加载与合成"已过时），故升入核心依赖；
# 1.8.1 为 GOTCHAS #348 的 vendored indextts 钉版口径。
emotion = []
# LoRA 训练管线（app/integrated_app/training/）。API 服务启动路径绝不 import 它
# （AGENTS.md（本地维护、不随仓库分发） 硬约束 #3），因此不进主依赖。datasets/argbind 已改为 training.data
# 内的可选懒加载（缺包时模块仍可 import，仅 legacy HF 路径函数抛 ImportError），
# 使单元测试在无 datasets 环境也能真实执行（不再全 skip）。
training = ["datasets>=2.14.0", "einops>=0.7.0", "argbind>=0.3.7", "tensorboard>=2.10.0"]

[project.scripts]
tts-multimodel = "integrated_app.cli:main"

[project.urls]
Homepage = "https://github.com/ReSerendipity/TTS_MultiModel"
Documentation = "https://github.com/ReSerendipity/TTS_MultiModel/tree/master/docs"
Repository = "https://github.com/ReSerendipity/TTS_MultiModel"
Issues = "https://github.com/ReSerendipity/TTS_MultiModel/issues"
Changelog = "https://github.com/ReSerendipity/TTS_MultiModel/blob/master/CHANGELOG.md"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["app"]
# vendor/ 包含 tn stub 等本地 fallback 实现，需被 setuptools 发现
include = ["integrated_app*", "integrated_app.vendor*"]

[tool.setuptools.package-data]
"integrated_app" = [
    "templates/**/*",
    "static/**/*",
    "locales/*.json",
    # 完整性自检的三件套必须随包走：清单、清单的 Ed25519 签名、验签公钥。
    # 少任何一件，装出来的环境里 `integrity_selfcheck.py` 就走"清单不存在 → 跳过自检"分支，
    # 而 config.yaml 默认 `security.integrity_selfcheck.enforce: true` —— 于是配置说自己
    # 在强制校验，实际一条都没校验。2026-09-22 核对 v2.2.2 的 wheel 时实测到此项缺失
    # （security/ 目录里只打进 .py）。现在缺清单会在 enforce 下直接拒绝启动，见该文件的自证。
    "security/integrity_manifest.json",
    "security/integrity_manifest.json.sig.ed25519",
    "security/manifest_signing_public_key.pem",
]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["app/integrated_app", "tests", "scripts"]
# WHY 必须 true：ruff 默认只把 exclude 应用于「目录递归发现」的文件，
# 命令行显式传入的路径（如 `ruff check app/integrated_app/`）会绕过 exclude，
# 导致上面 vendor/ 的排除形同虚设、vendored 上游代码被 --fix 静默改写。
force-exclude = true
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.git",
    "**/pynini_src",
    "**/reference_repos",
    # vendored 上游代码（voxcpm / indextts / tn 等）保持与上游字节一致，
    # 不由本仓 lint/format 改写，否则未来同步上游会冲突、推理行为可能被静默改变。
    # 与 .pre-commit-config.yaml 的 exclude: ^app/integrated_app/vendor/ 同源。
    "**/vendor",
    # transformers 4.52.1 符号回填文件（engines/transformers_452_backfill.py）是按上游源码
    # 逐块切片的字节级副本：风格与 5.x 时代的 SIM/UP/B 规则不兼容，且逐条改写会让
    # "与上游 diff 可读"这一维护前提消失。语义由 tests + 真机冒烟把关，同 vendor 口径。
    "**/transformers_452_backfill.py",
    "dist",
    "build",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"app/clean_launch.py" = ["E402", "I001"]
"app/integrated_app/training/config.py" = ["F821"]
"app/integrated_app/training/data.py" = ["F821"]
# model_manager_core 门面层有意用 `from .state import *` 共享模块级状态
# （state.py 统一持有 _model_lock / registry / 各类路径常量并显式 __all__ 导出），
# 因此 load/switch/unload 中的 F403/F405 是架构设计，不是缺陷。
# F401 必须一并忽略：model_manager.py 是纯 re-export 门面，其显式 import 的名字
# 在本文件内「未被使用」正是其存在意义；多行 import 的 `# noqa: F401` 只能挂在
# 报错行上，挂在收尾括号上无效，ruff --fix 会据此把整段 re-export 静默删除，
# 曾导致 routes/model.py ImportError、/api/model/* 全量 404、引擎无法切换。
"app/integrated_app/model_manager.py" = ["F401", "F403", "F405"]
"app/integrated_app/model_manager_core/load.py" = ["F401", "F403", "F405"]
"app/integrated_app/model_manager_core/switch.py" = ["F401", "F403", "F405"]
"app/integrated_app/model_manager_core/unload.py" = ["F401", "F403", "F405"]
# 测试与脚本必须先 sys.path.insert(...) 再 import 被测模块，无法把 import 提到文件顶部
"tests/*.py" = ["E402"]
"tests/integration/*.py" = ["E402"]
"scripts/*.py" = ["E402"]
# 入参校验类测试故意用 pytest.raises(Exception) 兜住所有异常，验证 Pydantic 拒绝路径
"tests/test_openai_api.py" = ["B017"]
"tests/test_voxcpm2_decorators.py" = ["B017"]

[tool.ruff.lint.isort]
known-first-party = ["integrated_app"]

[tool.mypy]
# 3.10 会让 mypy 以旧语法解析 numpy 新版 stub（其 __init__.pyi 用了 PEP 695 `type`
# 语句），直接报 "Type statement is only supported in Python 3.12 and greater" 并中断整轮检查。
# 与 .github/workflows/ci.yml lint job 的 python-version: "3.12" 对齐。
python_version = "3.12"
ignore_missing_imports = true
strict = false
warn_return_any = false
warn_unused_ignores = true
no_implicit_optional = false
show_error_codes = true
disable_error_code = ["annotation-unchecked"]
exclude = [
    "tests/e2e",
    "node_modules",
    "build",
    "dist",
    # vendored 上游代码不做类型检查：其 __init__.py 会让 mypy 报
    # "Source file found twice under different module names" 并直接中断整轮检查
    "vendor/",
]


[[tool.mypy.overrides]]
module = ["integrated_app.vendor.*"]
ignore_errors = true

# Breeze TTS 2 的固化上游代码（engines/breeze_tts2/vendor/，含 qwen_tts_min 裁剪副本）：
# 与上同口径——上游字节保持一致，不做本仓类型修缮；引擎适配层 engine.py 仍受检。
[[tool.mypy.overrides]]
module = ["integrated_app.engines.breeze_tts2.vendor.*"]
ignore_errors = true

# transformers 4.52.1 符号回填（逐块字节级上游副本）：不做本仓类型修缮，同 vendor 口径。
[[tool.mypy.overrides]]
module = ["integrated_app.engines.transformers_452_backfill"]
ignore_errors = true

# training/ 模块为「能力声明未验证」实验模块（综合评估主线：lora/ 无产物），
# 类型标注欠债整体豁免、待训练能力真正跑通后随产物一并补齐（P1-2 追踪项）。
[[tool.mypy.overrides]]
module = ["integrated_app.training.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "integration: integration tests requiring GPU",
    "benchmark: performance benchmark tests",
    "gpu: tests requiring a real GPU device",
    "cuda: tests requiring CUDA GPU for inference",
    "vram: tests for VRAM switching / memory management",
    "e2e: end-to-end tests with browser/server",
    "smoke: quick smoke tests for basic functionality",
    "stress: concurrent load/stress tests (run in nightly workflow)",
]

[tool.coverage.run]
source = ["app/integrated_app"]
branch = true
omit = ["*/tests/*", "*/templates/*", "*/static/*", "*/vendor/*"]

[tool.coverage.report]
# 覆盖率门槛：分阶段提升计划（随测试补充逐步调高）
#   v1: 20% -> v2: 30% -> v3: 40% -> v4: 45%（当前实际 47.55%）-> v5: 50% -> v6: 60%
fail_under = 45
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "pass",
]
