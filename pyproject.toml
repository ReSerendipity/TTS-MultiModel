[project]
name = "tts-multimodel"
version = "2.2.1"
description = "TTS MultiModel - Multi-engine Text-to-Speech platform with voice cloning, voice design, and LoRA fine-tuning"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "ReSerendipity" },
]
keywords = [
    "tts",
    "text-to-speech",
    "speech-synthesis",
    "voice-cloning",
    "voice-design",
    "voxcpm2",
    "indextts2",
    "lora",
    "fine-tuning",
    "fastapi",
    "pytorch",
    "deep-learning",
    "audio-generation",
    "speech",
    "chinese-tts",
    "multi-model",
    "script-dubbing",
    "streaming-tts",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
        "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: FastAPI",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: English",
    "Natural Language :: Japanese",
    "Natural Language :: Korean",
]
dependencies = [
    # === 深度学习框架（版本必须匹配：torch 2.5.x -> torchvision 0.20.x -> torchaudio 2.5.x）===
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "torchaudio>=2.5.1",
    # 版本策略：VoxCPM2 / IndexTTS2 的 tokenizer 与 modeling 需要较新 transformers API。
    "transformers>=4.57.0",
    "tokenizers>=0.19.0",
    # === AI 生态 ===
    "funasr>=1.0.0",
    "modelscope>=1.9.0",
    # modelscope 的 pipeline/config 解析在运行期需要 addict；引擎切换路径
    # （_load_voxcpm2_engine 强制 include_denoiser=True）会经 speech_zipenhancer
    # 走到它。缺失时降噪会降级关闭、音质下降，故列为生产依赖而非可选。
    "addict>=2.4.0",
    # === Web 框架 ===
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    # === 音频处理 ===
    "soundfile>=0.12.1",
    "pydub>=0.25.1",
    # librosa 被 audio_processing / resampling 与 VoxCPM2 的 prompt / script 模式
    # 在函数内懒导入（此前只作为 funasr 的传递依赖存在）。显式声明，避免上游
    # 依赖树变动后这些运行路径静默 ImportError。
    "librosa>=0.10.0",
    # safetensors 用于 engines/voxcpm2/lora.py 加载 LoRA 权重。
    "safetensors>=0.4.0",
    # === 数值计算 ===
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    # === 工具库 ===
    "pyyaml>=6.0",
    "httpx>=0.24.0",
    "aiofiles>=23.0",
    "cryptography>=41.0.0",
    # psutil 被 routes/system/health.py 与系统维护端点（stats/gpu/队列/内存泄漏检测）
    # 在模块导入期直接 import。此前仅作为传递依赖存在于 requirements-lock.txt，
    # 而 CI 按 requirements.txt 安装，导致 pytest 全矩阵 ImportError（M4/M5 安全批次引入）。
    # 显式声明与 librosa 同理：避免上游依赖树变动后运行路径静默 ImportError。
    "psutil>=5.9.0",
    # === 繁简转换（纯 Python 替代 opencc 源码编译）===
    "opencc-python-reimplemented>=0.1.0",
    # === 数据校验 ===
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "pytest-cov>=4.0", "ruff>=0.4", "mypy>=1.0"]
vllm = ["vllm>=0.6.0"]
watermark = []  # No extra deps needed, uses numpy/scipy only
# IndexTTS 情感「文本描述」模式（emo_text）需要 QwenEmotion 子模型，
# 其用 device_map 加载、依赖 accelerate。未安装时引擎仍可正常加载与合成
# （克隆 / 8 维向量情感模式均可用），仅该模式会被明确拒绝。
emotion = ["accelerate>=0.30.0"]
# LoRA 训练管线（app/integrated_app/training/）。API 服务启动路径绝不 import 它
# （AGENTS.md 硬约束 #3），因此不进主依赖；但缺 datasets 时 training.data 一
# 导入就 ModuleNotFoundError，故在此显式登记。
training = ["datasets>=2.14.0", "einops>=0.7.0", "argbind>=0.3.7"]

[project.scripts]
tts-multimodel = "integrated_app.cli:main"

[project.urls]
Homepage = "https://github.com/ReSerendipity/TTS_MultiModel"
Documentation = "https://github.com/ReSerendipity/TTS_MultiModel/tree/master/docs"
Repository = "https://github.com/ReSerendipity/TTS_MultiModel"
Issues = "https://github.com/ReSerendipity/TTS_MultiModel/issues"
Changelog = "https://github.com/ReSerendipity/TTS_MultiModel/blob/master/CHANGELOG.md"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["app"]
# vendor/ 包含 tn stub 等本地 fallback 实现，需被 setuptools 发现
include = ["integrated_app*", "integrated_app.vendor*"]

[tool.setuptools.package-data]
"integrated_app" = ["templates/**/*", "static/**/*", "locales/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["app/integrated_app", "tests", "scripts"]
# WHY 必须 true：ruff 默认只把 exclude 应用于「目录递归发现」的文件，
# 命令行显式传入的路径（如 `ruff check app/integrated_app/`）会绕过 exclude，
# 导致上面 vendor/ 的排除形同虚设、vendored 上游代码被 --fix 静默改写。
force-exclude = true
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.git",
    "**/pynini_src",
    "**/reference_repos",
    # vendored 上游代码（voxcpm / indextts / tn 等）保持与上游字节一致，
    # 不由本仓 lint/format 改写，否则未来同步上游会冲突、推理行为可能被静默改变。
    # 与 .pre-commit-config.yaml 的 exclude: ^app/integrated_app/vendor/ 同源。
    "**/vendor",
    "dist",
    "build",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"app/clean_launch.py" = ["E402", "I001"]
"app/integrated_app/training/config.py" = ["F821"]
"app/integrated_app/training/data.py" = ["F821"]
# model_manager_core 门面层有意用 `from .state import *` 共享模块级状态
# （state.py 统一持有 _model_lock / registry / 各类路径常量并显式 __all__ 导出），
# 因此 load/switch/unload 中的 F403/F405 是架构设计，不是缺陷。
# F401 必须一并忽略：model_manager.py 是纯 re-export 门面，其显式 import 的名字
# 在本文件内「未被使用」正是其存在意义；多行 import 的 `# noqa: F401` 只能挂在
# 报错行上，挂在收尾括号上无效，ruff --fix 会据此把整段 re-export 静默删除，
# 曾导致 routes/model.py ImportError、/api/model/* 全量 404、引擎无法切换。
"app/integrated_app/model_manager.py" = ["F401", "F403", "F405"]
"app/integrated_app/model_manager_core/load.py" = ["F401", "F403", "F405"]
"app/integrated_app/model_manager_core/switch.py" = ["F401", "F403", "F405"]
"app/integrated_app/model_manager_core/unload.py" = ["F401", "F403", "F405"]
# 测试与脚本必须先 sys.path.insert(...) 再 import 被测模块，无法把 import 提到文件顶部
"tests/*.py" = ["E402"]
"tests/integration/*.py" = ["E402"]
"scripts/*.py" = ["E402"]
# 入参校验类测试故意用 pytest.raises(Exception) 兜住所有异常，验证 Pydantic 拒绝路径
"tests/test_openai_api.py" = ["B017"]
"tests/test_voxcpm2_decorators.py" = ["B017"]

[tool.ruff.lint.isort]
known-first-party = ["integrated_app"]

[tool.mypy]
# 3.10 会让 mypy 以旧语法解析 numpy 新版 stub（其 __init__.pyi 用了 PEP 695 `type`
# 语句），直接报 "Type statement is only supported in Python 3.12 and greater" 并中断整轮检查。
# 与 .github/workflows/ci.yml lint job 的 python-version: "3.12" 对齐。
python_version = "3.12"
ignore_missing_imports = true
strict = false
warn_return_any = false
warn_unused_ignores = true
no_implicit_optional = false
show_error_codes = true
disable_error_code = ["annotation-unchecked"]
exclude = [
    "tests/e2e",
    "node_modules",
    "build",
    "dist",
    # vendored 上游代码不做类型检查：其 __init__.py 会让 mypy 报
    # "Source file found twice under different module names" 并直接中断整轮检查
    "vendor/",
]


[[tool.mypy.overrides]]
module = ["integrated_app.vendor.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "integration: integration tests requiring GPU",
    "benchmark: performance benchmark tests",
    "gpu: tests requiring a real GPU device",
    "cuda: tests requiring CUDA GPU for inference",
    "vram: tests for VRAM switching / memory management",
    "e2e: end-to-end tests with browser/server",
    "smoke: quick smoke tests for basic functionality",
    "stress: concurrent load/stress tests (run in nightly workflow)",
]

[tool.coverage.run]
source = ["app/integrated_app"]
branch = true
omit = ["*/tests/*", "*/templates/*", "*/static/*", "*/vendor/*"]

[tool.coverage.report]
# 覆盖率门槛：分阶段提升计划（随测试补充逐步调高）
#   v1: 20% -> v2: 30% -> v3: 40%（当前实际 40.11%）-> v4: 50% -> v5: 60%
fail_under = 40
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "pass",
]
